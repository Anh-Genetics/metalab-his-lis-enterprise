function saveClinicForm(id) {
  const code = document.getElementById('fClCode').value.trim(), name = document.getElementById('fClName').value.trim();
  if (!code || !name) return toast('Vui lòng nhập Mã và Tên phòng khám.', 'err');
  const data = {
    code, name, rep:document.getElementById('fClRep').value.trim(), phone:document.getElementById('fClPhone').value.trim(),
    tax:document.getElementById('fClTax').value.trim(), addr:document.getElementById('fClAddr').value.trim(),
    disc:Number(document.getElementById('fClDisc').value)||0, credit_limit:Number(document.getElementById('fClLim').value)||0
  };
  if (id) {
    const old = STATE.clinics.find(x => x.id === id);
    const diff = `Tên: "${old.name}" → "${data.name}"; CK: ${old.disc}% → ${data.disc}%; HM: ${fmtM(old.credit_limit)} → ${fmtM(data.credit_limit)}`;
    Object.assign(old, data);
    addAudit('UPDATE_CLINIC', `CLINIC:${code}`, diff);
    toast(`Đã cập nhật đối tác ${name}.`);
  } else {
    const nid = Math.max(0, ...STATE.clinics.map(x=>x.id)) + 1;
    STATE.clinics.push({ id:nid, ...data, status:'ACTIVE', deleted:false });
    addAudit('CREATE_CLINIC', `CLINIC:${code}`, `Thêm mới đối tác ${name} (CK ${data.disc}%, HM ${fmtM(data.credit_limit)})`);
    toast(`Đã thêm phòng khám đối tác ${name}.`);
  }
  closeModal(); renderPartnerMgr('clinics');
}

function openPartnerStatusModal(kind, id) {

        <option value="ACTIVE" ${item.status==='ACTIVE'?'selected':''}>ACTIVE — Đang hợp tác (Mở khóa Cổng B2B)</option>

      </select>
    </div>
    <div class="form-group"><label class="form-label">Lý do thay đổi (Bắt buộc ghi truy vết) *</label><input id="psReason" class="form-control" placeholder="VD: Quá hạn công nợ / Hết hạn hợp đồng / Gia hạn hợp đồng mới..." /></div>
    <button class="btn btn-primary" onclick="applyPartnerStatus('${kind}',${id})">Xác nhận &amp; Ghi Truy vết</button>`);

function applyPartnerStatus(kind, id) {
  const st = document.getElementById('psNewSt').value, reason = document.getElementById('psReason').value.trim();
  if (!reason) return toast('Vui lòng nhập lý do để lưu vào nhật ký truy vết.', 'err');
  const item = kind === 'clinic' ? STATE.clinics.find(x=>x.id===id) : STATE.doctors.find(x=>x.id===id);
  const oldSt = item.status || 'ACTIVE';
  item.status = st;
  const activeFlag = st === 'ACTIVE';
  STATE.users.forEach(u => {
    if (kind === 'clinic' && u.clinic_id === id && u.role === 'PARTNER') u.active = activeFlag;
    if (kind === 'doctor' && u.doctor_id === id && u.role === 'DOCTOR') u.active = activeFlag;
  });
  addAudit(kind.toUpperCase() + '_' + st, `${kind.toUpperCase()}:${item.code}`, `Đổi trạng thái ${oldSt} → ${st}. Lý do: ${reason}`);
  closeModal(); toast(`Đã chuyển trạng thái sang ${st} và ghi truy vết.`);
  renderPartnerMgr(kind === 'clinic' ? 'clinics' : 'doctors');
}

function openDeletePartnerModal(kind, id) {
  const item = kind === 'clinic' ? STATE.clinics.find(x=>x.id===id) : STATE.doctors.find(x=>x.id===id);
  const label = kind === 'clinic' ? item.name : item.full_name;
  const linkedOrders = STATE.orders.filter(o => kind === 'clinic' ? o.clinic_id === id : o.doctor_id === id).length;
  openModal(`Xác nhận Xóa Đối tác — ${label}`, `
    <p style="margin-bottom:10px;">Đối tác <b>${esc(label)}</b> hiện có <b>${linkedOrders}</b> phiếu xét nghiệm liên kết trong hệ thống.</p>
    <p class="muted" style="font-size:12.5px;margin-bottom:12px;">Theo quy định lưu trữ hồ sơ y tế (Luật KBCB 15/2023/QH15), thao tác xóa sẽ thực hiện <b>Xóa mềm (Soft Delete)</b>, tự động khóa tài khoản Cổng B2B và lưu toàn bộ vết lịch sử để có thể đối chiếu pháp lý hoặc khôi phục.</p>
    <div class="form-group"><label class="form-label">Lý do xóa đối tác *</label><input id="delReason" class="form-control" placeholder="Nhập lý do xóa..." /></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-outline" onclick="closeModal()">Hủy bỏ</button>
      <button class="btn btn-danger" onclick="confirmDeletePartner('${kind}',${id})">Xác nhận Xóa mềm &amp; Lưu Truy vết</button>
    </div>`);
}

function confirmDeletePartner(kind, id) {
  const reason = document.getElementById('delReason').value.trim();
  if (!reason) return toast('Vui lòng nhập lý do xóa đối tác.', 'err');
  const item = kind === 'clinic' ? STATE.clinics.find(x=>x.id===id) : STATE.doctors.find(x=>x.id===id);
  item.deleted = true; item.status = 'CANCELLED';
  STATE.users.forEach(u => {
    if (kind === 'clinic' && u.clinic_id === id && u.role === 'PARTNER') u.active = false;
    if (kind === 'doctor' && u.doctor_id === id && u.role === 'DOCTOR') u.active = false;
  });
  addAudit('DELETE_' + kind.toUpperCase(), `${kind.toUpperCase()}:${item.code}`, `Xóa mềm đối tác "${kind==='clinic'?item.name:item.full_name}". Lý do: ${reason}`);
  closeModal(); toast('Đã xóa mềm đối tác và ghi nhận truy vết.');
  renderPartnerMgr(kind === 'clinic' ? 'clinics' : 'doctors');
}

function restorePartner(kind, id) {
  const item = kind === 'clinic' ? STATE.clinics.find(x=>x.id===id) : STATE.doctors.find(x=>x.id===id);
  item.deleted = false; item.status = 'ACTIVE';
  STATE.users.forEach(u => {
    if (kind === 'clinic' && u.clinic_id === id && u.role === 'PARTNER') u.active = true;
    if (kind === 'doctor' && u.doctor_id === id && u.role === 'DOCTOR') u.active = true;
  });
  addAudit('RESTORE_' + kind.toUpperCase(), `${kind.toUpperCase()}:${item.code}`, `Khôi phục đối tác "${kind==='clinic'?item.name:item.full_name}" về trạng thái ACTIVE`);
  toast('Đã khôi phục đối tác thành công.');
  renderPartnerMgr(kind === 'clinic' ? 'clinics' : 'doctors', true);
}

function openEntityAuditModal(type, code, name) {
  const logs = STATE.audits.filter(a => (a.entity||'').includes(code) || (a.detail||'').includes(name) || (a.detail||'').includes(code));

function exportPartnerAuditCsv() {
  const logs = STATE.audits.filter(a => ['CLINIC','DOCTOR','PARTNER','LEGAL','PICKUP','CONSULT','ADDON'].some(k => (a.entity||'').includes(k) || (a.act||'').includes(k)));
  const csv = '\uFEFFThoiGian,NguoiThaoTac,HanhDong,DoiTuong,ChiTiet\n' + logs.map(a => `${a.at},"${a.user}",${a.act},"${a.entity}","${(a.detail||'').replace(/"/g,'""')}"`).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'})); a.download = 'Metalab_TruyVet_DoiTac.csv'; a.click();
  toast('Đã xuất nhật ký truy vết đối tác (.csv).');
}

function getActiveGasUrl() {
  const cfg = (window.METALAB_CONFIG && window.METALAB_CONFIG.GAS_WEBAPP_URL) ? window.METALAB_CONFIG.GAS_WEBAPP_URL.trim() : '';
  const st = (typeof STATE !== 'undefined' && STATE.settings && STATE.settings.gas_url) ? String(STATE.settings.gas_url).trim() : '';
  const ls = safeLsGet('metalab_gas_url').trim();
  return cfg || st || ls || '';
}

function getCloudToken() { return CLOUD_TOKEN || ''; }
function setCloudToken(tok) { CLOUD_TOKEN = tok || ''; }

async function cloudRpc(action, payload = {}) {
  const tok = getCloudToken();
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error(err && err.message ? err.message : String(err))))
        .apiCall(action, payload, tok);
    });
  }
  const url = getActiveGasUrl();
  if (!url || !url.startsWith('https://script.google.com/')) {
    throw new Error('Chưa cấu hình URL Google Apps Script Web App (/exec).');
  }
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload, token: tok }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

function mergeCloudDataIntoState(d) {
  if (!d) return;
  const toNum = v => {
    if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
    const s = String(v || '0').replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  };

  if (Array.isArray(d.lab_groups)) {
    CATALOG.groups = d.lab_groups.map(g => ({
      id: Number(g.ID || g.id), code: g.Code || '', name: g.Name || '',
      tube: g.Tube_Type || 'SERUM', color: g.Tube_Color || '#0F766E', tat: Number(g.Default_TAT_Min || 90)
    }));
  }
  if (Array.isArray(d.lab_packages)) {
    CATALOG.packages = d.lab_packages.map(p => ({
      id: Number(p.ID || p.id), code: p.Code || '', name: p.Name || '', disc: toNum(p.Discount_Rate || 0)
    }));
  }
  if (Array.isArray(d.lab_tests)) {
    CATALOG.tests = d.lab_tests.map(t => ({
      id: Number(t.ID || t.id), code: t.Code || t.Test_Code || '', name: t.Name || t.Test_Name || '',
      gid: Number(t.Group_ID || 2), price: toNum(t.List_Price),
      disc: toNum(t.Discount_Rate) > 1 ? toNum(t.Discount_Rate) / 100 : toNum(t.Discount_Rate),
      unit: t.Unit || '', ref: t.Ref_Range || '', meaning: t.Clinical_Meaning || ''
    }));
  }
  if (Array.isArray(d.users)) {
    STATE.users = d.users.map(u => ({
      id: Number(u.ID || u.id), username: u.Username || '', full_name: u.Full_Name || '',
      role: u.Role || 'STAFF', doctor_id: u.Doctor_ID || null, clinic_id: u.Clinic_ID || null,
      valid_from: u.Valid_From || '', valid_until: u.Valid_Until || '', active: String(u.Is_Active || 'TRUE').toUpperCase() !== 'FALSE'
    }));
  }
  STATE.clinics = (d.clinics || []).map(c => ({
    id: Number(c.ID || c.id), code: c.Code || '', name: c.Name || c.Clinic_Name || '',
    rep: c.Representative || '', phone: c.Phone || '', tax: c.Tax_Code || '', addr: c.Address || '',
    disc: toNum(c.Default_Discount || c.Discount_Rate || 0) <= 1 ? toNum(c.Default_Discount || 0) * 100 : toNum(c.Default_Discount || c.Discount_Rate || 0),
    credit_limit: toNum(c.Credit_Limit || 0), status: c.Partner_Status || c.Status || 'ACTIVE',
    deleted: String(c.Is_Deleted || '').toUpperCase() === 'TRUE'
  }));
  STATE.doctors = (d.doctors || []).map(doc => ({
    id: Number(doc.ID || doc.id), code: doc.Code || '', full_name: doc.Full_Name || '',
    specialty: doc.Specialty || '', license: doc.License_No || '', phone: doc.Phone || '',
    clinic_id: Number(doc.Clinic_ID || 0), status: doc.Partner_Status || doc.Status || 'ACTIVE'
  }));
  STATE.patients = (d.patients || []).map(p => ({
    id: Number(p.ID || p.id), code: p.Patient_Code || ('BN' + p.ID), full_name: p.Full_Name || '',
    birth_year: p.Birth_Year || '', gender: p.Gender || 'M', phone: p.Phone || '',
    cccd: p.CCCD || '', bhyt: p.BHYT_Card || '', address: p.Address || '', history: p.Medical_History || '',
    deleted: String(p.Status || '').toUpperCase() === 'DELETED'
  }));

  const itemsByOrder = {};
  (d.order_items || []).forEach(it => {
    const oid = String(it.Order_ID || '');
    if (!itemsByOrder[oid]) itemsByOrder[oid] = [];
    itemsByOrder[oid].push({
      id: Number(it.ID || 0), test_id: Number(it.Test_ID || 0), code: it.Test_Code || it.Code || '',
      name: it.Test_Name || it.Name || '', gid: Number(it.Group_ID || 2),
      list_price: toNum(it.List_Price), discount_rate: toNum(it.Discount_Rate), net_price: toNum(it.Net_Price),
      result_value: it.Result_Value !== undefined ? String(it.Result_Value) : '',
      unit: it.Unit || '', ref_range: it.Ref_Range || '', abnormal_flag: it.Abnormal_Flag || '',
      analyzer: it.Analyzer || '', status: it.Status || 'PENDING'
    });
  });
  const specsByOrder = {};
  (d.specimens || []).forEach(sp => {
    const oid = String(sp.Order_ID || '');
    if (!specsByOrder[oid]) specsByOrder[oid] = [];
    specsByOrder[oid].push({
      id: Number(sp.ID || 0), barcode: sp.Barcode || '', tube: sp.Tube_Type || 'SERUM',
      status: sp.Status || 'PENDING', rejection_reason: sp.Rejection_Reason || ''
    });
  });
  STATE.orders = (d.orders || []).map(o => ({
    id: Number(o.ID || 0), order_code: String(o.Order_Code || ''), patient_id: Number(o.Patient_ID || 0),
    doctor_id: Number(o.Doctor_ID || 0), clinic_id: Number(o.Clinic_ID || 0),
    order_date: String(o.Order_Date || ''), diagnosis: o.Diagnosis || '', priority: o.Priority || 'ROUTINE',
    payment_method: o.Payment_Method || 'CASH', payment_status: o.Payment_Status || 'UNPAID',
    total_list: toNum(o.Total_List), total_net: toNum(o.Total_Net), paid_amount: toNum(o.Paid_Amount),
    workflow_status: o.Workflow_Status || 'REGISTERED', lookup_token: o.Lookup_Token || '',
    consent_nd13: String(o.Consent_ND13 || 'TRUE').toUpperCase() !== 'FALSE',
    created_by: o.Created_By || '',
    items: itemsByOrder[String(o.ID || '')] || [],
    specimens: specsByOrder[String(o.ID || '')] || []
  })).reverse();

  STATE.payments = (d.payments || []).map(py => ({
    id: Number(py.ID || 0), code: py.Receipt_Code || ('PT-' + py.ID), order_code: String(py.Order_Code || py.Order_ID || ''),
    amount: toNum(py.Amount), method: py.Method || 'CASH', cashier: py.Cashier || '', at: String(py.Paid_At || '')
  })).reverse();
  STATE.iqc = (d.iqc || []).reverse();
  STATE.reagents = d.reagents || [];
  STATE.pickups = d.pickups || [];
  STATE.addons = d.addons || [];
  STATE.consults = d.consults || [];
  STATE.recollections = (d.recollections || []).map(r => ({
    id: Number(r.ID || 0), ticket_code: r.Ticket_Code || '', order_id: Number(r.Order_ID || 0),
    original_barcode: r.Original_Barcode || '', replacement_barcode: r.Replacement_Barcode || '',
    rejection_reason: r.Rejection_Reason || '', pickup_code: r.Pickup_Request_ID ? ('PKP-' + r.Pickup_Request_ID) : 'Nội bộ',
    status: r.Status || 'OPEN'
  }));
  STATE.criticalAlerts = (d.critical_alerts || []).map(c => ({
    id: Number(c.ID || 0), alert_code: c.Alert_Code || '', order_id: Number(c.Order_ID || 0),
    order_item_id: Number(c.Order_Item_ID || 0), channel: c.Channel || 'ZALO_ZNS',
    sla_deadline: c.SLA_Deadline || '', status: c.Delivery_Status || c.Status || 'DISPATCHED', acked_at: c.Acked_At || ''
  }));
  STATE.audits = (d.audits || []).map(a => ({
    at: String(a.Timestamp || ''), user: a.Actor || a.Username || 'SYSTEM', act: a.Action || '',
    entity: a.Entity || a.Entity_Type || '', detail: a.Details || a.Reason || '',
    before: a.Before_State || '', after: a.After_State || '', hmac: a.HMAC_Hash || ''
  }));
  STATE.totalAuditCount = STATE.audits.length;
}

async function syncGoogleCloud() {
  try {
    toast('Đang đồng bộ 100% dữ liệu trực tiếp từ Google Sheets MasterDB...', 'ok');
    const r = await cloudRpc('sync_pull', {});
    if (r && r.ok) {
      mergeCloudDataIntoState(r.data);
      STATE.cloudSyncedAt = r.synced_at || '';
      STATE.cloudConnected = true;
      if (typeof renderView === 'function') renderView();
      toast(`Đồng bộ thành công từ Google Sheets MasterDB (${r.synced_at}) — ${STATE.orders.length} phiếu!`);
    } else {
      toast((r && r.error) || 'Không thể đồng bộ Google Database.', 'err');
    }
  } catch (e) {
    toast('Lỗi đồng bộ Google Database: ' + e.message, 'err');
  }
}

    const brd = !cell ? 'var(--border)' : (cell.tube==='QC' ? 'var(--info)' : (cell.st==='DONE' ? 'var(--success)' : 'var(--warning)'));
    return `<div onclick="clickRackSlot('${pos}')" style="cursor:pointer;padding:10px 8px;border-radius:8px;border:1.5px solid ${brd};background:${bg};min-height:74px;">
      <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;"><span>${pos}</span><span>${cell?esc(cell.tube):'Trống'}</span></div>

    </div>`;
  }).join('')).join('');

  document.getElementById('viewContainer').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card teal"><div class="kpi-lbl">Mã Mẻ Chạy (Batch/Run)</div><div class="kpi-val">${esc(rk.batchCode)}</div><div class="kpi-sub">${esc(rk.analyzer)} • KTV: ${esc(rk.ktv)}</div></div>
      <div class="kpi-card blue"><div class="kpi-lbl">Vị trí đã nạp trên Rack</div><div class="kpi-val">${Object.keys(rk.slots).length} / 24 giếng</div><div class="kpi-sub">Hỗ trợ chia mẫu (Aliquot) &amp; tối ưu mẻ chạy</div></div>
      <div class="kpi-card ${STATE.iqcLocked?'red':'green'}"><div class="kpi-lbl">Khóa An toàn IQC (ISO 15189)</div><div class="kpi-val">${STATE.iqcLocked?'ĐANG KHÓA MẺ':'ĐẠT CHUẨN CHẠY'}</div><div class="kpi-sub">${STATE.iqcLocked?'Cần xử lý CAPA mở khóa':'Đủ điều kiện chạy máy & duyệt KQ'}</div></div>
    </div>
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Sơ đồ Rack / Plate 24 vị trí (A1–D6) — Nhấn vào giếng để gán hoặc cập nhật mẫu</span>

          <button class="btn btn-accent btn-sm" onclick="completeRackBatch()">Hoàn tất Mẻ chạy (All DONE)</button>
        </div>
      </div>

}

function clickRackSlot(pos) {
  const cur = STATE.limsRack.slots[pos];
  const allSp = [];
  STATE.orders.forEach(o => o.specimens.forEach(s => allSp.push({ barcode:s.barcode, pat:getPatient(o.patient_id).full_name, tube:s.tube })));
  openModal(`Vị trí Rack ${pos}`, cur ? `
    <p style="margin-bottom:10px;"><b>Barcode:</b> ${esc(cur.barcode)} • <b>Đối tượng:</b> ${esc(cur.pat)} • <b>Trạng thái:</b> ${esc(cur.st)}</p>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-accent" onclick="STATE.limsRack.slots['${pos}'].st='DONE';saveState();closeModal();renderLimsBatch();">Đánh dấu Hoàn tất</button>
      <button class="btn btn-danger" onclick="delete STATE.limsRack.slots['${pos}'];saveState();closeModal();renderLimsBatch();">Gỡ khỏi Rack</button>
    </div>` : `
    <div class="form-group"><label class="form-label">Chọn mẫu bệnh phẩm để nạp vào giếng ${pos}</label>
      <select id="rkSpSel" class="form-control">${allSp.map(s=>`<option value="${esc(s.barcode)}|${esc(s.pat)}|${esc(s.tube)}">${esc(s.barcode)} — ${esc(s.pat)} (${esc(s.tube)})</option>`).join('')}</select>
    </div>
    <button class="btn btn-accent" onclick="assignRackSlot('${pos}')">Nạp mẫu vào giếng ${pos}</button>`);
}

function assignRackSlot(pos) {
  const [barcode, pat, tube] = document.getElementById('rkSpSel').value.split('|');
  STATE.limsRack.slots[pos] = { barcode, pat, tube, st:'QUEUED' };
  addAudit('LIMS_RACK_ASSIGN', barcode, `Nạp mẫu ${barcode} vào vị trí ${pos} mẻ ${STATE.limsRack.batchCode}`);
  closeModal(); toast(`Đã nạp ${barcode} vào giếng ${pos}`); renderLimsBatch();
}

function completeRackBatch() {
  Object.values(STATE.limsRack.slots).forEach(s => s.st = 'DONE');
  addAudit('LIMS_BATCH_DONE', STATE.limsRack.batchCode, 'Hoàn tất toàn bộ mẻ chạy trên Rack');
  toast('Đã hoàn tất mẻ chạy LIMS.'); renderLimsBatch();
}

function toggleIqcLock() {
  STATE.iqcLocked = !STATE.iqcLocked;
  addAudit(STATE.iqcLocked ? 'IQC_HARD_LOCK' : 'IQC_UNLOCK', 'QMS', STATE.iqcLocked ? 'Khóa duyệt kết quả do vi phạm Westgard 1-3s' : 'Giám đốc chuyên môn phê duyệt mở khóa sau CAPA');
  toast(STATE.iqcLocked ? 'Đã kích hoạt KHÓA DUYỆT KẾT QUẢ do IQC lỗi!' : 'Đã phê duyệt mở khóa hệ thống IQC.', STATE.iqcLocked ? 'err' : 'ok');
  renderLimsBatch();
}

function openTrace360Modal(oid) {
  const o = STATE.orders.find(x => x.id === oid);
  if (!o) return;
  const p = getPatient(o.patient_id), d = getDoctor(o.doctor_id), cl = getClinic(o.clinic_id);
  const sp = o.specimens[0] || { barcode:'-', tube:'SERUM', status:'-' };
  const lastQc = STATE.iqc[STATE.iqc.length - 1] || { analyte:'Glucose', z:0, st:'PASS', at:'-' };
  const eq = STATE.equipment[0];
  const rg = STATE.reagents[0];
  const staff = STATE.hrStaff[1];

  // AI Reflex Testing suggestions based on abnormal results
  const reflex = [];
  o.items.forEach(i => {
    const v = parseFloat(i.result_value);
    if (i.name === 'Glucose' && v >= 7.0 && !o.items.some(x=>x.name==='HbA1c')) reflex.push({ name:'HbA1c', reason:'Glucose tăng cao (≥ 7.0 mmol/L) — AI đề xuất bổ sung HbA1c đánh giá đường huyết 3 tháng' });
    if (i.name === 'Creatinin' && v > 106 && !o.items.some(x=>x.name==='Ure')) reflex.push({ name:'Ure', reason:'Creatinin vượt ngưỡng — AI đề xuất bổ sung Ure đánh giá chức năng thận' });
    if (i.name === 'Cholesterol' && v > 5.2 && !o.items.some(x=>x.name==='LDL-Cholesterol')) reflex.push({ name:'LDL-Cholesterol', reason:'Cholesterol tăng — AI đề xuất bổ sung LDL-Cholesterol phân tầng nguy cơ tim mạch' });
  });

  openModal(`Truy xuất ngược 360° (ISO 15189:2022) — Phiếu ${o.order_code}`, `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px;">
      <div class="card" style="margin:0;padding:12px;"><b>1. Bệnh nhân &amp; Đồng thuận NĐ 13</b><div class="muted" style="font-size:12px;">${esc(p.full_name)} (${esc(p.code)})<br/>Đồng thuận chia sẻ dữ liệu: <span class="badge b-success">Đã xác nhận</span></div></div>
      <div class="card" style="margin:0;padding:12px;"><b>2. Bác sĩ &amp; Phòng khám B2B</b><div class="muted" style="font-size:12px;">${esc(d.full_name)}<br/>${esc(cl.name)}</div></div>
      <div class="card" style="margin:0;padding:12px;"><b>3. Mẫu bệnh phẩm &amp; Logistics</b><div class="muted" style="font-size:12px;">Barcode: <b>${esc(sp.barcode)}</b> (${esc(sp.tube)})<br/>Bảo quản: 2-8°C • Trạng thái: ${esc(sp.status)}</div></div>
      <div class="card" style="margin:0;padding:12px;"><b>4. Thiết bị &amp; Hiệu chuẩn</b><div class="muted" style="font-size:12px;">${esc(eq.name)}<br/>Serial: ${esc(eq.serial)} • Hiệu chuẩn đến ${esc(eq.nextCal)}</div></div>
      <div class="card" style="margin:0;padding:12px;"><b>5. Hóa chất &amp; Lô sử dụng</b><div class="muted" style="font-size:12px;">${esc(rg.name)}<br/>Lô: <b>${esc(rg.lot)}</b> • HSD: ${esc(rg.exp)}</div></div>
      <div class="card" style="margin:0;padding:12px;"><b>6. Nội kiểm IQC ngày chạy</b><div class="muted" style="font-size:12px;">${esc(lastQc.analyte)} • Z=${lastQc.z}<br/>Trạng thái: ${statusBadge(lastQc.st)}</div></div>
      <div class="card" style="margin:0;padding:12px;"><b>7. KTV &amp; Năng lực (HR Matrix)</b><div class="muted" style="font-size:12px;">${esc(staff.name)} (${esc(staff.cchn)})<br/>Năng lực Sinh hóa: <span class="badge b-success">${esc(staff.sh)}</span></div></div>

function addReflexTest(oid, testName) {
  const o = STATE.orders.find(x => x.id === oid);
  const t = CATALOG.tests.find(x => x.name === testName);
  if (!o || !t) return;
  const net = Math.round(t.price * (1 - t.disc));
  o.items.push({ id:Date.now(), test_id:t.id, code:t.code, name:t.name, gid:t.gid, list_price:t.price, discount_rate:t.disc, net_price:net, result_value:'', unit:t.unit, ref_range:t.ref, abnormal_flag:'', analyzer:'AI Reflex Add-on', status:'COLLECTED' });
  o.total_list += t.price; o.total_net += net;
  addAudit('AI_REFLEX_ADDON', o.order_code, `Bổ sung XN ${t.name} từ gợi ý AI Reflex Testing`);
  toast(`Đã thêm xét nghiệm bổ sung "${t.name}" vào phiếu ${o.order_code}!`);
  openTrace360Modal(oid);
}

const V52_UI = {
  orderSubtab: 'list', orderQ: '', orderClinic: 'ALL', orderStatus: 'ALL', orderPay: 'ALL', orderFlag: 'ALL', orderPage: 1,
  patQ: '', patGender: 'ALL', patPage: 1,

function v52SvgQr(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) { hash ^= text.charCodeAt(i); hash = Math.imul(hash, 16777619); }
  const size = 21, cell = 6, pad = 10, dim = size * cell + pad * 2;
  let rects = '';
  const isFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
  const drawFinder = (r0, c0) => {
    let o = '';
    for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
      if (r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4))
        o += `<rect x="${pad+(c0+c)*cell}" y="${pad+(r0+r)*cell}" width="${cell}" height="${cell}" fill="#0F172A"/>`;
    }
    return o;
  };
  rects += drawFinder(0,0) + drawFinder(0,size-7) + drawFinder(size-7,0);
  let seed = hash >>> 0;
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    if (isFinder(r, c)) continue;
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    if ((seed >>> 24) & 1) rects += `<rect x="${pad+c*cell}" y="${pad+r*cell}" width="${cell}" height="${cell}" fill="#0F172A"/>`;
  }
  return `<svg viewBox="0 0 ${dim} ${dim}" style="width:126px;height:126px;background:#fff;border:1px solid var(--border);border-radius:10px;">${rects}</svg>`;
}

function v52Hash16(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  return ((h2>>>0).toString(16).padStart(8,'0') + (h1>>>0).toString(16).padStart(8,'0')).toUpperCase();
}

  }

  const critSet = new Set();
  STATE.orders.forEach(o => { if ((o.items||[]).some(i => i.abnormal_flag==='HH'||i.abnormal_flag==='LL')) critSet.add(o.id); });
  const recSet = new Set((STATE.recollections||[]).map(r => r.order_id));

  const filtered = STATE.orders.filter(o => {

    if (V52_UI.orderStatus !== 'ALL' && o.workflow_status !== V52_UI.orderStatus) return false;
    if (V52_UI.orderPay !== 'ALL' && o.payment_method !== V52_UI.orderPay) return false;
    if (V52_UI.orderFlag === 'CRITICAL' && !critSet.has(o.id)) return false;
    if (V52_UI.orderFlag === 'RECOLLECT' && !recSet.has(o.id)) return false;
    if (q) {
      const p = getPatient(o.patient_id);
      const d = getDoctor(o.doctor_id);
      const hay = `${o.order_code} ${o.lookup_token} ${p.full_name} ${p.phone||''} ${d.full_name}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const pageSize = 25;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (V52_UI.orderPage > totalPages) V52_UI.orderPage = totalPages;
  const slice = filtered.slice((V52_UI.orderPage - 1) * pageSize, V52_UI.orderPage * pageSize);

  vc.innerHTML = `
    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:10px;">

function v52OpenOrderDetail(oid) {
  const o = STATE.orders.find(x => x.id === oid);
  if (!o) return;
  const p = getPatient(o.patient_id), d = getDoctor(o.doctor_id), c = getClinic(o.clinic_id);
  const due = Math.max(0, Number(o.total_net||0) - Number(o.paid_amount||0));
  openModal(`Chi tiết Phiếu Chỉ định ${o.order_code}`, `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;padding:12px;background:var(--bg);border-radius:10px;border:1px solid var(--border);font-size:13px;">
      <div><div class="text-muted">Bệnh nhân</div><b>${esc(p.full_name)}</b> (${esc(p.code)}) • ${p.birth_year||''} • ${esc(p.phone||'-')}</div>
      <div><div class="text-muted">Bác sĩ / Phòng khám</div><b>${esc(d.full_name)}</b> • ${esc(c.name)} • QR: <b>${esc(o.lookup_token)}</b></div>
    </div>
    <table class="tbl" style="margin-bottom:14px;">
      <thead><tr><th>Xét nghiệm</th><th class="text-right">Kết quả</th><th>Đơn vị / Tham chiếu</th><th>Cờ</th><th class="text-right">Giá ròng</th></tr></thead>
      <tbody>${(o.items||[]).map(it => `<tr>
        <td><b>${esc(it.name)}</b></td>
        <td class="text-right" style="font-weight:700;color:${it.abnormal_flag==='HH'||it.abnormal_flag==='LL'?'#DC2626':'inherit'};">${esc(it.result_value||'Chờ KQ')}</td>
        <td>${esc(it.unit||'')} (${esc(it.ref_range||'-')})</td>
        <td><b>${esc(it.abnormal_flag||'-')}</b></td>
        <td class="text-right">${fmtM(it.net_price)}</td>
      </tr>`).join('')}</tbody>
    </table>
    <div style="margin-bottom:14px;font-size:12.5px;"><b>Mẫu bệnh phẩm:</b> ${(o.specimens||[]).map(s => `<span class="badge b-neutral" style="margin-right:6px;">${esc(s.barcode)} (${esc(s.status)}${s.rejection_reason?' — '+esc(s.rejection_reason):''})</span>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px;flex-wrap:wrap;gap:8px;">
      <span style="font-size:13px;">Ròng: <b>${fmtM(o.total_net)}</b> • Đã thu: <b style="color:#0F766E;">${fmtM(o.paid_amount)}</b> • Nợ: <b style="color:#DC2626;">${fmtM(due)}</b></span>
      <div style="display:flex;gap:8px;">
        ${due>0 && o.workflow_status!=='CANCELLED' ? `<button class="btn btn-primary btn-sm" onclick="v52PayOrder(${o.id})">Thu thanh toán công nợ</button>`:''}
        <button class="btn btn-accent btn-sm" onclick="closeModal();v52JumpQr(${o.id})">Mở Cổng QR Bệnh nhân</button>
      </div>
    </div>`, true);
}

function v52PayOrder(oid) {
  const o = STATE.orders.find(x => x.id === oid);
  if (!o) return;
  const due = Math.max(0, Number(o.total_net||0) - Number(o.paid_amount||0));
  o.paid_amount = o.total_net; o.payment_status = 'PAID';
  addAudit('RECORD_PAYMENT', `ORDER #${o.order_code}`, `Thu thanh toán công nợ ${fmtM(due)}`);
  saveState(); toast(`Đã thu thanh toán công nợ ${fmtM(due)} cho phiếu ${o.order_code}`);
  closeModal(); renderOrdersV52('list');
}

function v52JumpQr(oid) {
  const o = STATE.orders.find(x => x.id === oid);
  if (o) { V52_UI.qrCode = o.order_code; V52_UI.qrTok = o.lookup_token; V52_UI.qrOrder = o; }
  navigate('qr_portal');
}

// ---- MODULE B: QUẢN LÝ BỆNH NHÂN MPI (1.006 HỒ SƠ THỰC TẾ) ----
function renderPatientsMpi() {
  const vc = document.getElementById('viewContainer');
  const q = V52_UI.patQ.trim().toLowerCase();
  const filtered = STATE.patients.filter(p => {
    if (V52_UI.patGender !== 'ALL' && p.gender !== V52_UI.patGender) return false;
    if (q && !`${p.code} ${p.full_name} ${p.phone||''} ${p.birth_year||''}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const pageSize = 25;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (V52_UI.patPage > totalPages) V52_UI.patPage = totalPages;
  const slice = filtered.slice((V52_UI.patPage - 1) * pageSize, V52_UI.patPage * pageSize);

  const ordByPat = {};
  STATE.orders.forEach(o => { (ordByPat[o.patient_id] = ordByPat[o.patient_id] || []).push(o); });

  vc.innerHTML = `
    <div class="card">
      <div class="card-header">
        <span class="card-title">Quản lý Bệnh nhân MPI (${filtered.length.toLocaleString('vi-VN')} / ${STATE.patients.length.toLocaleString('vi-VN')} hồ sơ)</span>
        <button class="btn btn-accent btn-sm" onclick="v52OpenAddPatientModal()">+ Thêm Bệnh nhân Mới</button>
      </div>
      <div class="form-row" style="margin-bottom:12px;">
        <input class="form-control" placeholder="Tìm mã BN, họ tên, SĐT, năm sinh..." value="${esc(V52_UI.patQ)}" oninput="V52_UI.patQ=this.value;V52_UI.patPage=1;renderPatientsMpi()">
        <select class="form-control" style="max-width:180px;" onchange="V52_UI.patGender=this.value;V52_UI.patPage=1;renderPatientsMpi()">
          <option value="ALL">Mọi giới tính</option>
          <option value="M" ${V52_UI.patGender==='M'?'selected':''}>Nam</option>
          <option value="F" ${V52_UI.patGender==='F'?'selected':''}>Nữ</option>
        </select>
      </div>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th>Mã BN (MPI)</th><th>Họ và tên</th><th>Năm sinh / Giới</th><th>SĐT</th><th class="text-right">Lượt XN</th><th>Phiếu gần nhất</th><th class="text-right">Thao tác</th></tr></thead>
          <tbody>
            ${slice.map(p => {
              const po = ordByPat[p.id] || [];
              const last = po[0];
              return `<tr>
                <td><b>${esc(p.code)}</b></td>
                <td><b>${esc(p.full_name)}</b></td>
                <td>${p.birth_year||'-'} • ${p.gender==='M'?'Nam':'Nữ'}</td>
                <td>${esc(p.phone||'-')}</td>
                <td class="text-right"><b>${po.length}</b></td>
                <td>${last ? `<b>${esc(last.order_code)}</b> ${statusBadge(last.workflow_status)}` : '-'}</td>
                <td class="text-right"><button class="btn btn-outline btn-sm" onclick="v52ViewPatHistory(${p.id})">Lịch sử XN</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;">
        <span>Trang <b>${V52_UI.patPage}</b> / <b>${totalPages}</b> (Tổng ${filtered.length.toLocaleString('vi-VN')} hồ sơ)</span>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-outline btn-sm" ${V52_UI.patPage<=1?'disabled':''} onclick="V52_UI.patPage--;renderPatientsMpi()">← Trước</button>
          <button class="btn btn-outline btn-sm" ${V52_UI.patPage>=totalPages?'disabled':''} onclick="V52_UI.patPage++;renderPatientsMpi()">Sau →</button>
        </div>
      </div>
    </div>`;
}

function v52OpenAddPatientModal() {
  openModal('Thêm Hồ sơ Bệnh nhân MPI Mới', `
    <div class="form-row">
      <div class="form-group"><label class="form-label">Họ tên *</label><input id="v52pName" class="form-control"></div>
      <div class="form-group"><label class="form-label">Năm sinh</label><input id="v52pYear" type="number" value="1990" class="form-control"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Giới tính</label><select id="v52pGen" class="form-control"><option value="M">Nam</option><option value="F">Nữ</option></select></div>
      <div class="form-group"><label class="form-label">SĐT</label><input id="v52pPhone" class="form-control"></div>
    </div>
    <button class="btn btn-accent" onclick="v52SavePatient()">Lưu Hồ sơ MPI</button>`);
}

function v52SavePatient() {
  const name = document.getElementById('v52pName').value.trim();
  if (!name) return toast('Vui lòng nhập họ tên bệnh nhân', 'err');
  const nid = Math.max(0, ...STATE.patients.map(x => x.id)) + 1;
  const p = { id: nid, code: `BN2611${nid}`, full_name: name, birth_year: Number(document.getElementById('v52pYear').value)||1990, gender: document.getElementById('v52pGen').value, phone: document.getElementById('v52pPhone').value.trim(), address: 'Hà Nội', history: '' };
  STATE.patients.unshift(p);
  addAudit('CREATE_PATIENT', `PATIENT #${p.code}`, `Tạo hồ sơ MPI ${p.code} - ${p.full_name}`);
  saveState(); toast(`Đã tạo hồ sơ ${p.code}`); closeModal(); renderPatientsMpi();
}

function v52ViewPatHistory(pid) {
  const p = getPatient(pid);
  const po = STATE.orders.filter(o => o.patient_id === pid);
  openModal(`Lịch sử Xét nghiệm Dọc — ${p.full_name} (${p.code})`, po.map(o => `
    <div style="padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;background:var(--bg);">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><b>Phiếu ${esc(o.order_code)} (${esc(o.order_date)})</b><div>${statusBadge(o.workflow_status)} <button class="btn btn-accent btn-sm" style="margin-left:6px;" onclick="closeModal();v52JumpQr(${o.id})">QR</button></div></div>
      ${(o.items||[]).map(it => `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;"><span>${esc(it.name)}</span><b style="color:${it.abnormal_flag==='HH'?'#DC2626':'inherit'};">${esc(it.result_value||'Chờ KQ')} ${esc(it.unit||'')} (${esc(it.abnormal_flag||'-')})</b></div>`).join('')}
    </div>`).join('') || '<div class="text-muted">Chưa có lượt xét nghiệm.</div>', true);
}

// ---- MODULE C: CỔNG TRẢ KẾT QUẢ BỆNH NHÂN QR ----
function renderQrPortalView() {
  const vc = document.getElementById('viewContainer');
  const sCrit = STATE.orders.find(o => o.workflow_status==='RELEASED' && (o.items||[]).some(i => i.abnormal_flag==='HH'));
  const recSet = new Set((STATE.recollections||[]).map(r => r.order_id));
  const sRec = STATE.orders.find(o => o.workflow_status==='RELEASED' && recSet.has(o.id));
  const sNorm = STATE.orders.find(o => o.workflow_status==='RELEASED' && !(o.items||[]).some(i => i.abnormal_flag==='HH'));
  if (!V52_UI.qrOrder && sCrit) { V52_UI.qrCode = sCrit.order_code; V52_UI.qrTok = sCrit.lookup_token; V52_UI.qrOrder = sCrit; }
  const o = V52_UI.qrOrder;
  const p = o ? getPatient(o.patient_id) : null;
  const d = o ? getDoctor(o.doctor_id) : null;
  const c = o ? getClinic(o.clinic_id) : null;
  const sig = o ? v52Hash16(`${o.order_code}|${o.workflow_status}|${(o.items||[]).length}|${o.lookup_token}`) : '';

  vc.innerHTML = `
    <div style="display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px;align-items:start;">
      <div class="card">
        <div class="card-header"><span class="card-title">Tra cứu QR Bệnh nhân</span></div>
        <div class="form-group"><label class="form-label">Mã phiếu xét nghiệm</label><input id="v52QrC" class="form-control" value="${esc(V52_UI.qrCode)}"></div>
        <div class="form-group"><label class="form-label">Mã tra cứu bảo mật (Token)</label><input id="v52QrT" class="form-control" value="${esc(V52_UI.qrTok)}"></div>
        <button class="btn btn-accent" style="width:100%;margin-bottom:14px;" onclick="v52DoQrLookup()">Tra cứu Kết quả</button>
        <div class="text-muted" style="font-size:12px;margin-bottom:8px;font-weight:600;">Chọn nhanh mẫu kiểm thử thực tế:</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${sCrit ? `<button class="btn btn-outline btn-sm" style="text-align:left;" onclick="v52JumpQr(${sCrit.id})">Nguy kịch (HH): ${esc(sCrit.order_code)} • ${esc(sCrit.lookup_token)}</button>`:''}
          ${sRec ? `<button class="btn btn-outline btn-sm" style="text-align:left;" onclick="v52JumpQr(${sRec.id})">Lấy mẫu lại (-R1): ${esc(sRec.order_code)} • ${esc(sRec.lookup_token)}</button>`:''}
          ${sNorm ? `<button class="btn btn-outline btn-sm" style="text-align:left;" onclick="v52JumpQr(${sNorm.id})">Thường quy: ${esc(sNorm.order_code)} • ${esc(sNorm.lookup_token)}</button>`:''}
        </div>
      </div>
      <div class="card">
        ${o ? `
          <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #991B1B;padding-bottom:12px;margin-bottom:14px;gap:12px;flex-wrap:wrap;">
            <div>
              <div style="font-size:16px;font-weight:800;color:#991B1B;">TRUNG TÂM XÉT NGHIỆM METALAB</div>
              <div class="text-muted" style="font-size:12px;">Phiếu Kết quả Xét nghiệm Điện tử • Chuẩn ISO 15189:2022</div>
              <div style="font-size:12.5px;margin-top:4px;">Mã phiếu: <b>${esc(o.order_code)}</b> • Ngày: ${esc(o.order_date)}</div>
            </div>
            <div style="text-align:center;">
              ${v52SvgQr(`METALAB|${o.order_code}|${o.lookup_token}`)}
              <div class="text-muted" style="font-size:11px;margin-top:2px;">TOKEN: <b>${esc(o.lookup_token)}</b></div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;font-size:13px;">
            <div>Họ tên BN: <b>${esc(p.full_name)}</b> (${esc(p.code)}) • ${p.birth_year||''} (${p.gender==='M'?'Nam':'Nữ'})</div>
            <div>BS chỉ định: <b>${esc(d.full_name)}</b> • ${esc(c.name)}</div>
          </div>
          <table class="tbl" style="margin-bottom:14px;">
            <thead><tr><th>Tên Xét nghiệm</th><th class="text-right">Kết quả</th><th>Đơn vị</th><th>Khoảng tham chiếu</th><th>Đánh giá</th></tr></thead>
            <tbody>${(o.items||[]).map(it => {
              const crit = it.abnormal_flag==='HH'||it.abnormal_flag==='LL';
              return `<tr style="${crit?'background:rgba(220,38,38,0.08);':''}">
                <td><b>${esc(it.name)}</b></td>
                <td class="text-right" style="font-weight:800;color:${crit?'#DC2626':'inherit'};">${esc(it.result_value||'Đang chạy')}</td>
                <td>${esc(it.unit||'')}</td>
                <td>${esc(it.ref_range||'-')}</td>
                <td style="font-weight:700;color:${crit?'#DC2626':it.abnormal_flag==='N'?'#0F766E':'#D97706'};">${crit?'NGUY KỊCH ('+esc(it.abnormal_flag)+')':(it.abnormal_flag==='N'?'Bình thường':esc(it.abnormal_flag||'-'))}</td>
              </tr>`;

    </div>`;
}

function v52DoQrLookup() {
  const code = document.getElementById('v52QrC').value.trim();
  const tok = document.getElementById('v52QrT').value.trim().toUpperCase();
  V52_UI.qrCode = code; V52_UI.qrTok = tok;
  const f = STATE.orders.find(x => x.order_code === code && String(x.lookup_token||'').toUpperCase() === tok);
  V52_UI.qrOrder = f || null;

function renderReportsV52() {
  const vc = document.getElementById('viewContainer');
  const byDoc = {};
  STATE.orders.forEach(o => {
    if (V52_UI.biClinic !== 'ALL' && String(o.clinic_id) !== V52_UI.biClinic) return;
    const k = o.doctor_id || 0;
    if (!byDoc[k]) {
      const d = getDoctor(o.doctor_id), c = getClinic(o.clinic_id);
      byDoc[k] = { doctor_id: o.doctor_id, clinic_id: o.clinic_id, doctor_name: d.full_name, clinic_code: c.code||'NOI-VIEN', clinic_name: c.name, disc: c.disc||0, orders:0, released:0, cancelled:0, net:0, paid:0, debt:0, recs:0, crits:0, acked:0 };
    }
    const r = byDoc[k];
    r.orders += 1;
    if (o.workflow_status === 'CANCELLED') r.cancelled += 1;
    else {
      if (o.workflow_status === 'RELEASED') r.released += 1;
      r.net += Number(o.total_net||0);
      r.paid += Number(o.paid_amount||0);
      r.debt += Math.max(0, Number(o.total_net||0) - Number(o.paid_amount||0));
    }
  });
  (STATE.recollections||[]).forEach(x => { if (byDoc[x.doctor_id||0]) byDoc[x.doctor_id||0].recs += 1; });
  (STATE.criticalAlerts||[]).forEach(x => { if (byDoc[x.doctor_id||0]) { byDoc[x.doctor_id||0].crits += 1; if (x.delivery_status==='ACKED') byDoc[x.doctor_id||0].acked += 1; } });

  const rows = Object.values(byDoc).sort((a,b) => b.net - a.net);
  const tot = rows.reduce((a,r) => ({ o:a.o+r.orders, rel:a.rel+r.released, net:a.net+r.net, paid:a.paid+r.paid, debt:a.debt+r.debt, rec:a.rec+r.recs, cr:a.cr+r.crits, ack:a.ack+r.acked }), {o:0,rel:0,net:0,paid:0,debt:0,rec:0,cr:0,ack:0});
  const maxNet = Math.max(...rows.map(r => r.net), 1);

  vc.innerHTML = `
    <div class="kpi-grid" style="margin-bottom:16px;">
      <div class="kpi-card k-green"><div class="kpi-lbl">Doanh Thu Ròng B2B</div><div class="kpi-val">${fmtM(tot.net)}</div><div class="kpi-sub">Đã thu: ${fmtM(tot.paid)} (${tot.net?((tot.paid/tot.net)*100).toFixed(1):0}%)</div></div>
      <div class="kpi-card k-blue"><div class="kpi-lbl">Tổng Chỉ Định XN</div><div class="kpi-val">${tot.o.toLocaleString('vi-VN')} phiếu</div><div class="kpi-sub">Đã trả KQ: ${tot.rel.toLocaleString('vi-VN')} • Lấy lại 0₫: ${tot.rec}</div></div>
      <div class="kpi-card k-amber"><div class="kpi-lbl">Công Nợ Đối Tác</div><div class="kpi-val">${fmtM(tot.debt)}</div><div class="kpi-sub">Khóa tự động khi vượt 100% hạn mức</div></div>
      <div class="kpi-card k-red"><div class="kpi-lbl">SLA Nguy Kịch (&lt;30p)</div><div class="kpi-val">${tot.cr?Math.round((tot.ack/tot.cr)*100):100}% (${tot.ack}/${tot.cr})</div><div class="kpi-sub">Truy vết CSDL: ${(STATE.totalAuditCount||STATE.audits.length).toLocaleString('vi-VN')} bản ghi</div></div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-header" style="flex-wrap:wrap;gap:8px;">
        <span class="card-title">Biểu đồ Doanh thu Đã thu (Xanh) &amp; Công nợ (Đỏ) theo Bác sĩ Đối tác</span>
        <select class="form-control" style="max-width:260px;" onchange="V52_UI.biClinic=this.value;renderReportsV52()">
          <option value="ALL">Tất cả Phòng khám</option>
          ${STATE.clinics.map(c => `<option value="${c.id}" ${V52_UI.biClinic===String(c.id)?'selected':''}>${esc(c.code)} — ${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${rows.slice(0, 8).map(r => {
          const wPaid = ((r.paid / maxNet) * 100).toFixed(1);
          const wDebt = ((r.debt / maxNet) * 100).toFixed(1);
          return `<div>
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><b>${esc(r.doctor_name)} <span class="text-muted">(${esc(r.clinic_code)} • CK ${r.disc}%)</span></b><b>${fmtM(r.net)}</b></div>
            <div style="height:14px;background:var(--border);border-radius:7px;overflow:hidden;display:flex;">
              <div style="width:${wPaid}%;background:#0F766E;" title="Đã thanh toán: ${fmtM(r.paid)}"></div>
              <div style="width:${wDebt}%;background:#DC2626;" title="Công nợ: ${fmtM(r.debt)}"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Bảng Xếp hạng KPI &amp; Đối soát theo từng Bác sĩ (${rows.length})</span></div>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th>Bác sĩ / Phòng khám</th><th class="text-right">Chỉ định</th><th class="text-right">Trả KQ</th><th class="text-right">Lấy lại 0₫</th><th class="text-right">SLA Nguy kịch</th><th class="text-right">Doanh thu ròng</th><th class="text-right">Đã thanh toán</th><th class="text-right">Công nợ</th><th class="text-right">Xem</th></tr></thead>
          <tbody>${rows.map(r => `<tr>
            <td><b>${esc(r.doctor_name)}</b><div class="text-muted" style="font-size:11px;">${esc(r.clinic_code)} • ${esc(r.clinic_name)}</div></td>
            <td class="text-right"><b>${r.orders}</b></td>
            <td class="text-right" style="color:#0F766E;font-weight:700;">${r.released}</td>
            <td class="text-right">${r.recs}</td>
            <td class="text-right" style="font-weight:700;color:#0F766E;">${r.acked}/${r.crits}</td>
            <td class="text-right"><b>${fmtM(r.net)}</b></td>
            <td class="text-right" style="color:#0F766E;">${fmtM(r.paid)}</td>
            <td class="text-right" style="color:#DC2626;font-weight:700;">${fmtM(r.debt)}</td>
            <td class="text-right"><button class="btn btn-outline btn-sm" onclick="V52_UI.orderClinic='${r.clinic_id}';V52_UI.orderPage=1;navigate('orders')">Phiếu</button></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

async function v53CloudPush(action, payload) {
  try {
    const res = await cloudRpc(action, payload);
    if (res && res.ok === false) toast('Google DB từ chối ghi (' + action + '): ' + (res.error || ''), 'err');
  } catch (err) {
    toast('Lỗi ghi Google DB (' + action + '): ' + err.message, 'err');
  }
}

function v53LogAudit(act, entity, detail, beforeObj, afterObj) {
  STATE.totalAuditCount = (STATE.totalAuditCount || STATE.audits.length) + 1;
  const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
  STATE.audits.unshift({
    at: now,
    user: CURRENT_USER ? CURRENT_USER.username : 'admin',
    act, entity, detail,
    before: beforeObj ? JSON.stringify(beforeObj) : '',
    after: afterObj ? JSON.stringify(afterObj) : '',
  });
  saveState();
  v53CloudPush('log_audit_event', { act, entity, detail, before: beforeObj, after: afterObj });
}

function v53SavePatientForm(pid) {
  const name = document.getElementById('v53pName').value.trim();
  if (!name) return toast('Vui lòng nhập họ tên bệnh nhân', 'err');
  const data = { full_name: name, birth_year: Number(document.getElementById('v53pYear').value)||1990, gender: document.getElementById('v53pGen').value, phone: document.getElementById('v53pPhone').value.trim(), address: document.getElementById('v53pAddr').value.trim() };
  if (pid) {
    const p = STATE.patients.find(x => x.id === pid);
    const before = { ...p };
    Object.assign(p, data);
    v53LogAudit('UPDATE_PATIENT', `PATIENT #${p.code}`, `Cập nhật hồ sơ BN ${p.code}`, before, p);
    v53CloudPush('save_patient', p);
    toast(`Đã cập nhật hồ sơ ${p.code}`);
  } else {
    const nid = Math.max(0, ...STATE.patients.map(x => x.id)) + 1;
    const p = { id: nid, code: `BN2611${nid}`, ...data, history: '', deleted: false };
    STATE.patients.unshift(p);
    v53LogAudit('CREATE_PATIENT', `PATIENT #${p.code}`, `Tạo hồ sơ MPI ${p.code} - ${p.full_name}`, null, p);
    v53CloudPush('save_patient', p);
    toast(`Đã thêm hồ sơ ${p.code}`);
  }
  closeModal(); renderPatientsMpi();
}

function v53OpenDeletePatient(pid) {
  const p = STATE.patients.find(x => x.id === pid);
  if (!p) return;
  const activeCnt = STATE.orders.filter(o => o.patient_id === pid && ['IN_PROGRESS','VALIDATED','RELEASED'].includes(o.workflow_status)).length;
  if (activeCnt > 0) return toast(`Không thể xóa hồ sơ đã có ${activeCnt} phiếu đang phân tích hoặc đã trả kết quả!`, 'err');
  openModal(`Xác nhận Xóa mềm Hồ sơ ${p.code}`, `
    <div class="form-group"><label class="form-label">Lý do xóa mềm (lưu truy vết CSDL) *</label><input id="v53DelRea" class="form-control" value="Hồ sơ trùng lặp / nhập sai"></div>
    <button class="btn btn-danger" onclick="v53ConfirmDeletePatient(${pid})">Xác nhận Xóa mềm</button>`);
}

function v53ConfirmDeletePatient(pid) {
  const p = STATE.patients.find(x => x.id === pid);
  const rea = document.getElementById('v53DelRea').value.trim();
  if (!rea) return toast('Vui lòng nhập lý do xóa mềm.', 'err');
  const before = { deleted: false };
  p.deleted = true; p.delete_reason = rea;
  v53LogAudit('DELETE_PATIENT', `PATIENT #${p.code}`, `Xóa mềm BN ${p.code} (Lý do: ${rea})`, before, { deleted: true, delete_reason: rea });
  toast(`Đã xóa mềm hồ sơ ${p.code}`); closeModal(); renderPatientsMpi();
}

function v53RestorePatient(pid) {
  const p = STATE.patients.find(x => x.id === pid);
  if (!p) return;
  p.deleted = false; p.delete_reason = '';
  v53LogAudit('RESTORE_PATIENT', `PATIENT #${p.code}`, `Khôi phục hồ sơ BN ${p.code}`, { deleted: true }, { deleted: false });
  toast(`Đã khôi phục hồ sơ ${p.code}`); renderPatientsMpi();
}

// ============================================================================
// METALAB ENTERPRISE v5.4 — FLEXIBLE QUARTERLY BI (Q1/Q2/Q3/9M 2026) & LIVE GOOGLE SHEETS VERIFICATION
// ============================================================================
// ============================================================================
// METALAB ENTERPRISE v5.5 PURE-DB — 100% LIVE DATABASE DASHBOARD & BI REPORTS
// ZERO STATIC FRONTEND DATA — EVERY NUMBER MATCHES GOOGLE SHEETS MASTERDB 100%
// ============================================================================
function computeLiveBiMetrics(periodKey) {
  const allValid = (STATE.orders || []).filter(o => String(o.workflow_status || '').toUpperCase() !== 'CANCELLED');
  const filtered = allValid.filter(o => {
    const d = String(o.order_date || '');
    if (!periodKey || periodKey === 'ALL') return true;
    if (periodKey === 'Q1') return d >= '2026-01-01' && d <= '2026-03-31 23:59:59';
    if (periodKey === 'Q2') return d >= '2026-04-01' && d <= '2026-06-30 23:59:59';
    if (periodKey === 'Q3') return d >= '2026-07-01' && d <= '2026-09-30 23:59:59';
    if (periodKey === 'Q4') return d >= '2026-10-01' && d <= '2026-12-31 23:59:59';
    return d.startsWith(periodKey);
  });

  let gross = 0, net = 0, collected = 0, released = 0;
  const byMonth = {};
  const byClinic = {};
  const byGroup = {};

  filtered.forEach(o => {
    const tl = Number(o.total_list || 0);
    const tn = Number(o.total_net || 0);
    const pa = Number(o.paid_amount || 0);
    gross += tl; net += tn; collected += pa;
    if (String(o.workflow_status).toUpperCase() === 'RELEASED') released++;

    const ym = String(o.order_date || '').slice(0, 7) || 'Chưa rõ';
    if (!byMonth[ym]) byMonth[ym] = { month: ym, total_orders: 0, net_revenue: 0, collected_amount: 0, open_debt: 0 };
    byMonth[ym].total_orders++;
    byMonth[ym].net_revenue += tn;
    byMonth[ym].collected_amount += pa;
    byMonth[ym].open_debt += Math.max(0, tn - pa);

    const cl = (STATE.clinics || []).find(c => String(c.id) === String(o.clinic_id));
    const cname = cl ? cl.name : 'Khách lẻ / Tự đến';
    if (!byClinic[cname]) byClinic[cname] = { clinic_name: cname, total_orders: 0, net_revenue: 0, collected_amount: 0, open_debt: 0 };
    byClinic[cname].total_orders++;
    byClinic[cname].net_revenue += tn;
    byClinic[cname].collected_amount += pa;
    byClinic[cname].open_debt += Math.max(0, tn - pa);

    (o.items || []).forEach(it => {
      const grp = (CATALOG.groups || []).find(g => String(g.id) === String(it.gid));
      const gname = grp ? grp.name : ('Nhóm #' + (it.gid || 'Khác'));
      if (!byGroup[gname]) byGroup[gname] = { group_name: gname, test_count: 0, net_revenue: 0 };
      byGroup[gname].test_count++;
      byGroup[gname].net_revenue += Number(it.net_price || 0);
    });
  });

  const openDebt = Math.max(0, net - collected);
  const crits = STATE.criticalAlerts || [];
  const ackedCrits = crits.filter(c => String(c.status || '').toUpperCase() === 'ACKED').length;

  return {
    summary: { total_orders: filtered.length, released, gross_revenue: gross, net_revenue: net, collected_amount: collected, open_debt: openDebt },
    critical: { total: crits.length, acked: ackedCrits },
    by_month: Object.values(byMonth).sort((a, b) => a.month.localeCompare(b.month)),
    by_clinic: Object.values(byClinic).sort((a, b) => b.net_revenue - a.net_revenue),
    by_group: Object.values(byGroup).sort((a, b) => b.net_revenue - a.net_revenue)
  };
}

              <div style="width:${((c.open_debt / maxC) * 100).toFixed(1)}%;background:#DC2626;"></div>
            </div>
          </div>`).join('') || '<div class="text-muted">Chưa có dữ liệu.</div>'}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">Cơ cấu Chuyên môn theo Nhóm Xét nghiệm (${m.by_group.length})</span></div>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>Nhóm Xét nghiệm</th><th class="text-right">Số chỉ số</th><th class="text-right">Doanh thu ròng</th><th class="text-right">Tỷ trọng</th></tr></thead>
        <tbody>${m.by_group.map(g => `<tr>
          <td><b>${esc(g.group_name)}</b></td>
          <td class="text-right">${g.test_count.toLocaleString('vi-VN')}</td>
          <td class="text-right"><b>${fmtM(g.net_revenue)}</b></td>
          <td class="text-right">${sm.net_revenue ? ((g.net_revenue / sm.net_revenue) * 100).toFixed(1) : '0.0'}%</td>
        </tr>`).join('') || '<tr><td colspan="4" class="text-muted" style="text-align:center;">Chưa có dữ liệu chỉ số xét nghiệm.</td></tr>'}</tbody>
      </table></div>
    </div>`;
};

function v55ExportCsv() {
  const m = computeLiveBiMetrics(V52_UI.biPeriod || 'ALL');
  const header = 'Thang,Tong_Chi_Dinh,Doanh_Thu_Rong,Da_Thu,Cong_No\n';
  const body = m.by_month.map(r => `${r.month},${r.total_orders},${Math.round(r.net_revenue)},${Math.round(r.collected_amount)},${Math.round(r.open_debt)}`).join('\n');
  const blob = new Blob(['\uFEFF' + header + body], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `MetaLab_LiveDB_${V52_UI.biPeriod || 'ALL'}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('Đã xuất báo cáo CSV từ dữ liệu Google Database.');
}

window.addEventListener('DOMContentLoaded', () => { pingGoogleDbHealth(); });

</script>
