<style>
:root {
  --primary: #0f4c5c;
  --primary-2: #16697a;
  --accent: #0d9488;
  --accent-soft: #e6f6f4;
  --sidebar-bg: #0b2630;
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --danger: #dc2626;
  --danger-soft: #fee2e2;
  --warning: #d97706;
  --warning-soft: #fef3c7;
  --success: #059669;
  --success-soft: #d1fae5;
  --info: #2563eb;
  --info-soft: #dbeafe;
  --radius: 10px;
  --pad-cell: 10px 12px;
  --pad-card: 18px 20px;
  --font-size: 13.5px;
  --shadow: 0 1px 3px rgba(15,23,42,.07), 0 1px 2px rgba(15,23,42,.04);
  --shadow-lg: 0 18px 40px rgba(15,23,42,.18);
}
body[data-theme="metalab"] { --primary:#991b1b; --primary-2:#b91c1c; --accent:#dc2626; --accent-soft:#fef2f2; --sidebar-bg:#1c1917; }
body[data-theme="navy"] { --primary:#1e3a5f; --primary-2:#2b547e; --accent:#2563eb; --accent-soft:#eff6ff; --sidebar-bg:#0f172a; }
body[data-theme="emerald"] { --primary:#065f46; --primary-2:#047857; --accent:#10b981; --accent-soft:#ecfdf5; --sidebar-bg:#062c22; }
body[data-theme="indigo"] { --primary:#3730a3; --primary-2:#4f46e5; --accent:#6366f1; --accent-soft:#eef2ff; --sidebar-bg:#1e1b4b; }
body[data-density="compact"] { --pad-cell: 6px 9px; --pad-card: 12px 14px; --font-size: 12.5px; }
body[data-density="comfortable"] { --pad-cell: 13px 14px; --pad-card: 22px 24px; --font-size: 14px; }
body.dark {
  --bg:#090f1d; --surface:#111827; --surface-2:#1e293b; --border:#334155;
  --text:#f1f5f9; --muted:#94a3b8; --accent-soft:#134e4a;
  --danger-soft:#450a0a; --warning-soft:#451a03; --success-soft:#064e3b; --info-soft:#1e3a8a;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); font-size: var(--font-size); line-height: 1.5;
  overflow-x: hidden;
}

/* ---- LOGIN GATE (ZERO-TRUST COMMERCIAL) ---- */
.login-gate {
  position: fixed; inset: 0; z-index: 9999;
  background: radial-gradient(circle at 20% 20%, #134e4a 0%, #0b2c37 45%, #071921 100%);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.login-gate.hidden { display: none; }
.login-card {
  width: 100%; max-width: 420px; background: var(--surface); border-radius: 16px;
  padding: 36px 32px; box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,.08);
}
.login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.login-logo {
  width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 20px;
}
.login-title { font-size: 17px; font-weight: 800; color: var(--text); line-height: 1.25; }
.login-sub { font-size: 12.5px; color: var(--muted); }
.login-err {
  background: var(--danger-soft); color: var(--danger); padding: 10px 12px; border-radius: 8px;
  font-size: 12.5px; margin-bottom: 14px; display: none; font-weight: 500;
}
.login-err.show { display: block; }
.login-footer-link {
  margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
  text-align: center; font-size: 12.5px; color: var(--muted);
}
.login-footer-link button {
  background: none; border: none; color: var(--accent); font-weight: 700; cursor: pointer; font-family: inherit;
}

/* ---- APP SHELL ---- */
.app-shell { display: flex; min-height: 100vh; }
.app-shell.hidden { display: none; }
.sidebar {
  width: 254px; background: var(--sidebar-bg); color: #cbd5e1;
  display: flex; flex-direction: column; flex-shrink: 0;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; transition: width .2s ease;
}
.sidebar.collapsed { width: 68px; }
.sidebar.collapsed .brand-text, .sidebar.collapsed .nav-sec, .sidebar.collapsed .nav-lbl, .sidebar.collapsed .nav-cnt { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px 0; margin: 3px 8px; }
.brand-box {
  padding: 16px; border-bottom: 1px solid rgba(255,255,255,.08);
  display: flex; align-items: center; gap: 11px; min-height: 62px;
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg, #14b8a6, #0284c7);
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px;
}
.brand-name { color: #fff; font-weight: 700; font-size: 13.5px; line-height: 1.2; }
.brand-sub { color: #94a3b8; font-size: 11px; }
.nav-sec {
  padding: 14px 16px 5px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase; color: #64748b;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8.5px 14px; margin: 2px 10px;
  border-radius: 8px; cursor: pointer; color: #cbd5e1; font-size: 13px; font-weight: 500;
  transition: all .15s; border: none; background: none; width: calc(100% - 20px); text-align: left; font-family: inherit;
}
.nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-item.active { background: linear-gradient(90deg, var(--accent), var(--primary-2)); color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(13,148,136,.28); }
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; stroke-width: 2; }
.nav-cnt { margin-left: auto; background: rgba(255,255,255,.15); color: #fff; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 99px; }

.main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 60px; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
  gap: 10px; position: sticky; top: 0; z-index: 60;
}
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.breadcrumb { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.breadcrumb b { color: var(--text); font-size: 14.5px; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.icon-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; position: relative; transition: .15s;
}
.icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 16px; height: 16px; }
.notif-dot {
  position: absolute; top: -4px; right: -4px; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 99px;
  display: flex; align-items: center; justify-content: center; padding: 0 4px;
}

.search-pill {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
  padding: 6px 11px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
  display: flex; align-items: center; gap: 8px; font-family: inherit;
}
.search-pill:hover { border-color: var(--accent); color: var(--text); }
.search-pill kbd {
  background: var(--surface); border: 1px solid var(--border); padding: 1px 5px;
  border-radius: 4px; font-size: 10.5px; color: var(--muted);
}
.user-chip {
  display: flex; align-items: center; gap: 8px; padding: 4px 10px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
}
.u-avatar {
  width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff;
  font-weight: 700; font-size: 11.5px; display: flex; align-items: center; justify-content: center;
}
.u-meta { line-height: 1.15; }
.u-name { font-weight: 700; font-size: 12px; }
.u-role { font-size: 10px; color: var(--muted); }

.content-wrap { padding: 20px 22px; flex: 1; }

/* ---- UI COMPONENTS ---- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--pad-card); box-shadow: var(--shadow); margin-bottom: 16px;
}
.card-hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-title { font-size: 14.5px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 7px; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 17px; box-shadow: var(--shadow); border-left: 4px solid var(--primary);
}
.kpi-card.teal { border-left-color: #0d9488; }
.kpi-card.blue { border-left-color: #2563eb; }
.kpi-card.green { border-left-color: #059669; }
.kpi-card.amber { border-left-color: #d97706; }
.kpi-card.red { border-left-color: #dc2626; }
.kpi-lbl { font-size: 11.8px; color: var(--muted); font-weight: 600; }
.kpi-val { font-size: 21px; font-weight: 800; color: var(--text); margin: 3px 0; }
.kpi-sub { font-size: 11.5px; color: var(--muted); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-order { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 1024px) {
  .grid-2, .grid-order { grid-template-columns: 1fr; }
  .search-pill span, .u-meta { display: none; }
}
@media (max-width: 760px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 120; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.mobile-open { transform: translateX(0); }
}

.form-group { margin-bottom: 11px; }
.form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
.form-control {
  width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit;
}
.form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,.15); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7.5px 13px; border-radius: 7px; border: 1px solid transparent;
  font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; transition: .15s; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-2); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { filter: brightness(0.92); }
.btn-outline { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-outline:hover { background: var(--surface-2); border-color: var(--accent); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 5px 9px; font-size: 11.8px; }

.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
table.tbl th {
  background: var(--surface-2); color: var(--muted); font-weight: 700; text-align: left;
  padding: var(--pad-cell); border-bottom: 1px solid var(--border); font-size: 11.3px;
  text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
}
table.tbl td { padding: var(--pad-cell); border-bottom: 1px solid var(--border); vertical-align: middle; }
table.tbl tr:hover td { background: var(--surface-2); }
.text-right { text-align: right; }
.text-center { text-align: center; }
.muted { color: var(--muted); }

.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.b-success { background: var(--success-soft); color: var(--success); }
.b-warning { background: var(--warning-soft); color: var(--warning); }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-info { background: var(--info-soft); color: var(--info); }
.b-neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 13px; border: none; background: none; cursor: pointer; font-size: 12.8px; font-weight: 600;
  color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

.picker-list { max-height: 370px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
.pick-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 8px 11px; border-bottom: 1px solid var(--border); cursor: pointer;
}
.pick-row:hover { background: var(--accent-soft); }
.pick-row.sel { background: var(--accent-soft); border-left: 3px solid var(--accent); }

/* ---- MODAL & TOAST ---- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(15,23,42,.56); z-index: 2000;
  display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(2px);
}
.modal-bg.show { display: flex; }
.modal-box {
  background: var(--surface); border-radius: 13px; width: 100%; max-width: 680px;
  max-height: 90vh; overflow-y: auto; padding: 20px 22px; box-shadow: var(--shadow-lg);
}
.modal-box.wide { max-width: 960px; }
.modal-hdr { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
.toast-wrap { position: fixed; bottom: 18px; right: 18px; z-index: 3500; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #0f172a; color: #fff; padding: 10px 15px; border-radius: 8px; font-size: 12.8px; box-shadow: var(--shadow-lg); max-width: 380px; }
.toast.ok { background: #065f46; }
.toast.err { background: #991b1b; }

/* ---- PRINT SLIP ---- */
.print-sheet { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 8px; padding: 22px; font-size: 12.5px; }
@media print {
  body * { visibility: hidden; }
  .print-sheet, .print-sheet * { visibility: visible; }
  .print-sheet { position: fixed; inset: 0; border: none; padding: 12mm; }
}
</style>
</head>

  try {

  } catch (_) {}
  return buildDefaultState();
})();

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (_) {}
  updateBadges();
}

function addAudit(act, entity, detail) {
  const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
  STATE.audits.unshift({ at: now, user: CURRENT_USER ? CURRENT_USER.username : 'SYSTEM', act, entity, detail });
  if (STATE.audits.length > 200) STATE.audits.pop();
  saveState();
}

function toast(msg, type='ok') {
  const w = document.getElementById('toastWrap');
  const d = document.createElement('div');
  d.className = `toast ${type}`;
  d.textContent = msg;
  w.appendChild(d);
  setTimeout(() => d.remove(), 3500);
}

}

function applyAppearance() {
  document.body.setAttribute('data-theme', STATE.settings.theme || 'teal');
  document.body.setAttribute('data-density', STATE.settings.density || 'standard');
  document.getElementById('loginFacName').textContent = STATE.settings.facility_name;
  document.getElementById('loginDeptName').textContent = STATE.settings.department_name;
  document.getElementById('sbBrandName').textContent = STATE.settings.facility_name.slice(0, 24);
}

function showLoginGate(msg='') {
  CURRENT_USER = null;
  document.getElementById('appShell').classList.add('hidden');
  document.getElementById('loginGate').classList.remove('hidden');
  const err = document.getElementById('loginErr');
  if (msg) { err.textContent = msg; err.classList.add('show'); } else err.classList.remove('show');
  document.getElementById('lPass').value = '';
}

function resetAutoLock() {
  if (AUTO_LOCK_TIMER) clearTimeout(AUTO_LOCK_TIMER);
  if (!CURRENT_USER) return;
  const mins = Number(STATE.settings.auto_lock_min || 15);
  AUTO_LOCK_TIMER = setTimeout(() => {
    showLoginGate(`Hệ thống tự động khóa sau ${mins} phút không hoạt động.`);
  }, mins * 60 * 1000);
}
['click','keydown','mousemove'].forEach(ev => window.addEventListener(ev, () => { if (CURRENT_USER) resetAutoLock(); }, { passive: true }));

document.getElementById('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const err = document.getElementById('loginErr');
  err.classList.remove('show');
  const now = Date.now();
  if (LOCKED_UNTIL > now) {
    err.textContent = `Tài khoản tạm khóa bảo mật. Vui lòng thử lại sau ${Math.ceil((LOCKED_UNTIL - now)/1000)} giây.`;
    err.classList.add('show');
    return;
  }
  const u = document.getElementById('lUser').value.trim().toLowerCase();
  const p = document.getElementById('lPass').value;
  const found = STATE.users.find(x => x.username.toLowerCase() === u && x.pass === p && x.active);
  if (!found) {
    FAILED_TRIES++;
    if (FAILED_TRIES >= 5) {
      LOCKED_UNTIL = Date.now() + 30000;
      FAILED_TRIES = 0;
      err.textContent = 'Nhập sai quá 5 lần. Tài khoản tạm khóa 30 giây.';
    } else {
      err.textContent = 'Tên đăng nhập hoặc mật khẩu không chính xác.';
    }
    err.classList.add('show');
    return;
  }
  FAILED_TRIES = 0;
  enterApp(found);
});

function isPartnerUser() {
  return CURRENT_USER && (CURRENT_USER.role === 'DOCTOR' || CURRENT_USER.role === 'PARTNER');
}

function getScopedOrders() {
  if (!CURRENT_USER) return [];
  if (CURRENT_USER.role === 'DOCTOR' && CURRENT_USER.doctor_id) return STATE.orders.filter(o => o.doctor_id === CURRENT_USER.doctor_id);
  if (CURRENT_USER.role === 'PARTNER' && CURRENT_USER.clinic_id) return STATE.orders.filter(o => o.clinic_id === CURRENT_USER.clinic_id);
  return STATE.orders;
}

function enterApp(user) {
  CURRENT_USER = user;
  document.getElementById('loginGate').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  document.getElementById('uName').textContent = user.full_name;
  document.getElementById('uRole').textContent = isPartnerUser() ? (user.role === 'DOCTOR' ? 'CỔNG BÁC SĨ ĐỐI TÁC' : 'CỔNG PHÒNG KHÁM ĐỐI TÁC') : user.role;
  document.getElementById('uAvatar').textContent = user.full_name[0].toUpperCase();
  addAudit('LOGIN', 'AUTH', `Đăng nhập thành công (${user.role})`);
  buildSidebar();
  updateBadges();
  resetAutoLock();
  if (isPartnerUser()) {
    navigate('p_dash');
    if (!STATE.agreements[user.username]) openPartnerDpaModal();
  } else {
    navigate('dashboard');
  }

function getAlertsList() {
  const alerts = [];
  STATE.orders.forEach(o => o.items.forEach(it => {
    if (it.abnormal_flag === 'HH' || it.abnormal_flag === 'LL') {
      alerts.push({ type:'danger', title:`Giá trị Nguy kịch (${it.abnormal_flag})`, msg:`Phiếu ${o.order_code}: ${it.name} = ${it.result_value} ${it.unit}`, view:'lis_result' });
    }
  }));
  STATE.reagents.forEach(r => {
    if (r.qty <= r.min) alerts.push({ type:'warning', title:'Sắp hết hóa chất', msg:`${r.name} (Tồn: ${r.qty} / Min: ${r.min})`, view:'inventory' });
    if (r.exp <= '2026-12-31') alerts.push({ type:'warning', title:'Hóa chất cận date', msg:`${r.name} — Lô ${r.lot} hết hạn ${r.exp}`, view:'inventory' });
  });
  STATE.iqc.forEach(q => {
    if (q.st !== 'PASS') alerts.push({ type:'warning', title:`Cảnh báo Westgard (${q.st})`, msg:`${q.analyte}: Z = ${q.z} (${q.at})`, view:'iqc' });
  });
  return alerts;
}

// ==== 1. DASHBOARD BI ====
function renderDashboard() {
  const active = STATE.orders.filter(o => o.workflow_status !== 'CANCELLED');
  const netRev = active.reduce((s, o) => s + o.total_net, 0);
  const grossRev = active.reduce((s, o) => s + o.total_list, 0);
  const collected = active.reduce((s, o) => s + o.paid_amount, 0);
  const debtRev = active.filter(o => o.payment_status !== 'PAID').reduce((s, o) => s + (o.total_net - o.paid_amount), 0);
  const released = active.filter(o => o.workflow_status === 'RELEASED').length;
  const alerts = getAlertsList();

  // Group breakdown
  const grpMap = {};
  active.forEach(o => o.items.forEach(it => {
    const g = getGroup(it.gid).name;
    grpMap[g] = grpMap[g] || { name:g, cnt:0, rev:0 };
    grpMap[g].cnt++; grpMap[g].rev += it.net_price;
  }));
  const grpArr = Object.values(grpMap).sort((a,b) => b.rev - a.rev).slice(0, 6);
  const maxG = Math.max(...grpArr.map(x => x.rev), 1);

  // Day breakdown
  const dayMap = {};
  active.forEach(o => { const d = o.order_date.slice(0, 10); dayMap[d] = (dayMap[d] || 0) + o.total_net; });
  const days = Object.entries(dayMap).sort((a,b) => a[0].localeCompare(b[0]));
  const maxD = Math.max(...days.map(x => x[1]), 1);

  document.getElementById('viewContainer').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card teal"><div class="kpi-lbl">Doanh Thu Thực Thu</div><div class="kpi-val">${fmtM(netRev)}</div><div class="kpi-sub">Đã thu: ${fmtM(collected)} • Niêm yết: ${fmtM(grossRev)}</div></div>
      <div class="kpi-card blue"><div class="kpi-lbl">Phiếu Khám &amp; Xét Nghiệm</div><div class="kpi-val">${active.length} phiếu</div><div class="kpi-sub">Đã duyệt trả KQ: ${released} • Đang xử lý: ${active.length - released}</div></div>
      <div class="kpi-card amber"><div class="kpi-lbl">Công Nợ Chờ Tất Toán</div><div class="kpi-val">${fmtM(debtRev)}</div><div class="kpi-sub">${STATE.clinics.length} phòng khám đối tác • ${STATE.doctors.length} bác sĩ</div></div>
      <div class="kpi-card ${alerts.length > 0 ? 'red' : 'green'}"><div class="kpi-lbl">Cảnh Báo Lâm Sàng &amp; ISO 15189</div><div class="kpi-val">${alerts.length} cảnh báo</div><div class="kpi-sub">Danh mục chuẩn hóa: ${CATALOG.tests.length} DVXN • ${CATALOG.packages.length} gói</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-hdr"><span class="card-title">Doanh thu theo ngày (VNĐ)</span></div>
        <svg viewBox="0 0 ${Math.max(380, days.length * 76 + 40)} 185" style="width:100%;height:190px;">
          <line x1="12" y1="158" x2="100%" y2="158" stroke="#cbd5e1" stroke-width="1"/>
          ${days.map(([d, v], i) => {
            const h = Math.max(12, Math.round((v / maxD) * 130));
            const x = 24 + i * 74, y = 158 - h;
            return `<rect x="${x}" y="${y}" width="42" height="${h}" rx="5" fill="var(--accent)"/>
                    <text x="${x+21}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--primary)">${Math.round(v/1000)}k</text>
                    <text x="${x+21}" y="175" text-anchor="middle" font-size="10" fill="#64748b">${d.slice(5)}</text>`;
          }).join('')}
        </svg>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">Cơ cấu Doanh thu theo Nhóm Xét nghiệm</span></div>
        ${grpArr.map(g => `
          <div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
              <b>${esc(g.name)}</b><span>${g.cnt} XN • <b>${fmtM(g.rev)}</b></span>
            </div>
            <div style="height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;">
              <div style="height:100%;width:${Math.round(g.rev/maxG*100)}%;background:linear-gradient(90deg,var(--primary),var(--accent));"></div>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Phiếu Khám &amp; Chỉ Định Gần Đây</span>
        <button class="btn btn-accent btn-sm" onclick="navigate('orders')">+ Lập Phiếu Khám Mới</button>
      </div>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>Mã Phiếu</th><th>Ngày lập</th><th>Bệnh nhân</th><th>Bác sĩ chỉ định</th><th class="text-right">Thành tiền</th><th>Thanh toán</th><th>LIS</th><th class="text-right">Phiếu In</th></tr></thead>
        <tbody>${STATE.orders.slice(0, 8).map(o => `
          <tr>
            <td><b>${esc(o.order_code)}</b></td><td>${esc(o.order_date)}</td><td><b>${esc(getPatient(o.patient_id).full_name)}</b></td>
            <td>${esc(getDoctor(o.doctor_id).full_name)}</td><td class="text-right"><b>${fmtM(o.total_net)}</b></td>
            <td>${statusBadge(o.payment_method)} ${statusBadge(o.payment_status)}</td><td>${statusBadge(o.workflow_status)}</td>
            <td class="text-right">
              <button class="btn btn-outline btn-sm" onclick="openPrintSlip(${o.id},'order')">Chỉ định</button>
              <button class="btn btn-outline btn-sm" onclick="openPrintSlip(${o.id},'result')">Kết quả</button>
            </td>
          </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

function switchOrderTab(t) {
  document.getElementById('otabNew').classList.toggle('active', t === 'new');
  document.getElementById('otabList').classList.toggle('active', t === 'list');
  document.getElementById('orderNewPane').style.display = t === 'new' ? 'grid' : 'none';
  document.getElementById('orderListPane').style.display = t === 'list' ? 'block' : 'none';
}

function renderTestPicker() {
  const q = (document.getElementById('tpQ')?.value || '').toLowerCase().trim();
  const gid = document.getElementById('tpG')?.value || '';
  const selIds = new Set(ORDER_CART.map(x => x.id));
  const list = CATALOG.tests.filter(t => (!gid || String(t.gid) === gid) && (!q || t.name.toLowerCase().includes(q) || t.code.toLowerCase().includes(q) || t.meaning.toLowerCase().includes(q))).slice(0, 100);
  document.getElementById('tpList').innerHTML = list.map(t => `
    <div class="pick-row ${selIds.has(t.id) ? 'sel' : ''}" onclick="toggleCart(${t.id})">
      <div style="min-width:0;">
        <div style="font-weight:600;">${esc(t.name)} <span class="badge b-neutral">${esc(t.code)}</span></div>
        <div class="muted" style="font-size:11.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;">${esc(getGroup(t.gid).name)} ${t.meaning ? '• ' + esc(t.meaning.slice(0,68)) : ''}</div>
      </div>
      <div class="text-right" style="flex-shrink:0;">
        <div style="font-weight:700;color:var(--primary);">${fmtM(Math.round(t.price * (1 - t.disc)))}</div>
        <div class="muted" style="font-size:11px;text-decoration:line-through;">${fmtM(t.price)}</div>
      </div>
    </div>`).join('') || '<div style="padding:14px;" class="muted">Không tìm thấy xét nghiệm phù hợp.</div>';
}

function toggleCart(id) {
  const idx = ORDER_CART.findIndex(x => x.id === id);
  if (idx >= 0) ORDER_CART.splice(idx, 1);
  else { const t = CATALOG.tests.find(x => x.id === id); if (t) ORDER_CART.push({ ...t }); }
  renderCart(); renderTestPicker();
}

function applyPkg(pid) {
  const tests = CATALOG.tests.filter(t => t.pkgs.includes(pid));
  let added = 0;
  tests.forEach(t => { if (!ORDER_CART.some(x => x.id === t.id)) { ORDER_CART.push({ ...t }); added++; } });
  renderCart(); renderTestPicker();
  toast(`Đã áp dụng gói khám (+${added} xét nghiệm)`);
}

function updateCartDisc(id, pct) {
  const it = ORDER_CART.find(x => x.id === id);
  if (it) { it.disc = Math.max(0, Math.min(1, Number(pct || 0) / 100)); renderCart(); }
}

function renderCart() {
  let gross = 0, net = 0;
  document.getElementById('cBody').innerHTML = ORDER_CART.map(t => {
    const ln = Math.round(t.price - t.price * t.disc);
    gross += t.price; net += ln;
    return `<tr>
      <td><b>${esc(t.name)}</b><div class="muted" style="font-size:11px;">${esc(t.code)}</div></td>
      <td class="text-right">${fmtM(t.price)}</td>
      <td><input type="number" min="0" max="100" step="5" class="form-control" style="padding:4px 6px;" value="${Math.round(t.disc*100)}" onchange="updateCartDisc(${t.id},this.value)" /></td>
      <td class="text-right"><b>${fmtM(ln)}</b></td>
      <td><button class="btn btn-outline btn-sm" onclick="toggleCart(${t.id})">✕</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="text-center muted" style="padding:16px;">Chọn Gói XN hoặc nhấn vào dịch vụ bên phải để thêm vào phiếu.</td></tr>';
  document.getElementById('cCnt').textContent = ORDER_CART.length;
  document.getElementById('cGross').textContent = fmtM(gross);
  document.getElementById('cDisc').textContent = fmtM(gross - net);
  document.getElementById('cNet').textContent = fmtM(net);
}

function createOrder() {
  const name = document.getElementById('opName').value.trim();
  if (!name) return toast('Vui lòng nhập họ tên bệnh nhân.', 'err');
  if (!ORDER_CART.length) return toast('Vui lòng chọn ít nhất 1 dịch vụ xét nghiệm.', 'err');

  const pid = STATE.patients.length + 1;
  STATE.patients.unshift({
    id: pid, code: `BN2611${String(pid).padStart(3,'0')}`, full_name: name,
    birth_year: Number(document.getElementById('opYear').value) || null,
    gender: document.getElementById('opGender').value,
    phone: document.getElementById('opPhone').value.trim(),
    cccd: document.getElementById('opCCCD').value.trim(), address: '', history: '',
  });
  const docId = Number(document.getElementById('opDoc').value);
  const doc = getDoctor(docId);
  const payM = document.getElementById('opPay').value;
  const isPaid = payM !== 'DEBT';
  const seq = String(STATE.orders.length + 1).padStart(3, '0');
  const code = '261121' + seq;
  const tok = Math.random().toString(36).slice(2, 10).toUpperCase();
  const items = ORDER_CART.map(t => ({
    id: Math.floor(Math.random()*1e9), test_id:t.id, code:t.code, name:t.name, gid:t.gid,
    list_price:t.price, discount_rate:t.disc, net_price:Math.round(t.price*(1-t.disc)),
    result_value:'', unit:t.unit, ref_range:t.ref, abnormal_flag:'', delta_flag:false, delta_prev:'', analyzer:'', status:'PENDING'
  }));
  const tubes = [...new Set(items.map(i => getGroup(i.gid).tube))];
  const specimens = tubes.map((tb, idx) => ({
    id: Math.floor(Math.random()*1e9), barcode: `SP-${code}-0${idx+1}`, tube: tb,
    color: (CATALOG.groups.find(g => g.tube === tb) || {}).color || '#DC2626',
    status: 'PENDING', by: '', tat: '2026-11-21 13:30'
  }));
  const tList = items.reduce((s,i)=>s+i.list_price, 0);
  const tNet = items.reduce((s,i)=>s+i.net_price, 0);
  const newOrd = {
    id: STATE.orders.length + 1, order_code: code, patient_id: pid, doctor_id: docId, clinic_id: doc.clinic_id || 1,
    order_date: new Date().toISOString().slice(0,16).replace('T',' '),
    diagnosis: document.getElementById('opDiag').value.trim(), icd10: '', priority: document.getElementById('opPrio').value,
    payment_method: payM, payment_status: isPaid ? 'PAID' : 'UNPAID', workflow_status: 'REGISTERED', lookup_token: tok,
    total_list: tList, total_net: tNet, paid_amount: isPaid ? tNet : 0, created_by: CURRENT_USER.full_name, items, specimens
  };
  STATE.orders.unshift(newOrd);
  if (isPaid) STATE.payments.unshift({ id:Date.now(), code:`PT-${code}`, order_code:code, patient:name, amount:tNet, method:payM, cashier:CURRENT_USER.full_name, at:newOrd.order_date });
  ORDER_CART = [];
  addAudit('CREATE_ORDER', code, `Tạo phiếu ${code} (${items.length} XN, ${fmtM(tNet)})`);
  toast(`Đã tạo phiếu ${code} & ${specimens.length} barcode mẫu!`);
  openPrintSlip(newOrd.id, 'order');
  renderOrders();
}

            <td><b style="font-family:monospace;">${esc(s.barcode)}</b></td>

              ${s.status!=='REJECTED'&&s.status!=='STORED' ? `<button class="btn btn-outline btn-sm" onclick="openRejectModal(${o.id},${s.id})">Từ chối</button>` : ''}
              ${s.status==='RECEIVED' ? `<button class="btn btn-outline btn-sm" onclick="spAct(${o.id},${s.id},'STORED')">Lưu kho</button>` : ''}

function spAct(oid, sid, st, reason='') {
  const o = STATE.orders.find(x => x.id === oid);
  const s = o?.specimens.find(x => x.id === sid);
  if (!s) return;
  s.status = st; s.by = CURRENT_USER.full_name; if (reason) s.reason = reason;
  if (st === 'COLLECTED' && o.workflow_status === 'REGISTERED') o.workflow_status = 'COLLECTED';
  if (st === 'RECEIVED' && ['REGISTERED','COLLECTED'].includes(o.workflow_status)) o.workflow_status = 'IN_PROGRESS';
  addAudit('SPECIMEN_' + st, s.barcode, `Cập nhật mẫu ${s.barcode} -> ${st}`);
  toast(`Đã cập nhật mẫu ${s.barcode} -> ${st}`);
  renderSpecimens();
}

function openRejectModal(oid, sid) {
  openModal('Từ chối Mẫu Bệnh phẩm', `
    <div class="form-group"><label class="form-label">Lý do từ chối mẫu *</label>
      <select id="rejSel" class="form-control"><option>Mẫu tán huyết (Hemolysis)</option><option>Thiếu thể tích mẫu</option><option>Mẫu đông cục (ống EDTA)</option><option>Sai nhãn / thông tin hành chính</option></select>
    </div>
    <button class="btn btn-danger" onclick="spAct(${oid},${sid},'REJECTED',document.getElementById('rejSel').value);closeModal();">Xác nhận Từ chối</button>`);
}

function renderLisResults() {
  document.getElementById('viewContainer').innerHTML = `
    <div class="card">
      <div class="card-hdr"><span class="card-title">Danh sách Nhập, Kiểm tra Delta Check &amp; Duyệt Kết quả XN</span></div>

            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
}

function evalFlag(valStr, testId) {
  const num = parseFloat(String(valStr).replace(',', '.'));
  const t = CATALOG.tests.find(x => x.id === testId);
  if (isNaN(num) || !t) return 'N';
  if (t.clow !== null && num <= t.clow) return 'LL';
  if (t.chigh !== null && num >= t.chigh) return 'HH';
  if (t.rlow !== null && num < t.rlow) return 'L';
  if (t.rhigh !== null && num > t.rhigh) return 'H';
  return 'N';
}

function openResultModal(oid) {
  const o = STATE.orders.find(x => x.id === oid);
  if (!o) return;
  openModal(`Nhập & Duyệt Kết quả — Phiếu ${o.order_code} (${getPatient(o.patient_id).full_name})`, `
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
      <span><b>Trạng thái:</b> ${statusBadge(o.workflow_status)}</span>
      <span><b>Mã tra cứu QR:</b> <code>${esc(o.lookup_token)}</code></span>
    </div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>Xét nghiệm</th><th style="width:140px">Kết quả</th><th>Đơn vị</th><th>Tham chiếu</th><th>Cảnh báo</th></tr></thead>
      <tbody>${o.items.map(it => {
        const fc = ['HH','LL'].includes(it.abnormal_flag) ? 'b-danger' : (['H','L'].includes(it.abnormal_flag) ? 'b-warning' : 'b-success');
        return `<tr>
          <td><b>${esc(it.name)}</b><div class="muted" style="font-size:11px;">${esc(it.code)}</div></td>
          <td><input class="form-control r-in" data-iid="${it.id}" value="${esc(it.result_value)}" placeholder="Nhập KQ..." /></td>
          <td>${esc(it.unit || '-')}</td><td>${esc(it.ref_range || '-')}</td>
          <td>${it.abnormal_flag ? `<span class="badge ${fc}">${esc(it.abnormal_flag)}</span>` : '-'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <div style="margin-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="saveOrderResults(${o.id})">Lưu Kết quả</button>
        <button class="btn btn-accent" onclick="approveOrder(${o.id})">Ký duyệt &amp; Phát hành</button>
      </div>
      <button class="btn btn-outline" onclick="openPrintSlip(${o.id},'result')">Xem &amp; In Phiếu KQ</button>
    </div>`, true);
}

function saveOrderResults(oid) {
  const o = STATE.orders.find(x => x.id === oid);
  const crits = [];
  document.querySelectorAll('.r-in').forEach(inp => {
    const it = o.items.find(x => String(x.id) === inp.dataset.iid);
    if (!it) return;
    const v = inp.value.trim();
    if (v !== '') {
      it.result_value = v;
      it.abnormal_flag = evalFlag(v, it.test_id);
      it.status = 'ANALYZED';
      if (['HH','LL'].includes(it.abnormal_flag)) crits.push(`${it.name}: ${v} (${it.abnormal_flag})`);
    }
  });
  const allDone = o.items.every(i => i.result_value !== '');
  if (o.workflow_status !== 'RELEASED') o.workflow_status = allDone ? 'VALIDATED' : 'IN_PROGRESS';
  addAudit('SAVE_RESULTS', o.order_code, `Cập nhật kết quả phiếu ${o.order_code}`);
  toast(crits.length ? `CẢNH BÁO NGUY KỊCH: ${crits.join(', ')}` : 'Đã lưu kết quả xét nghiệm.', crits.length ? 'err' : 'ok');
  openResultModal(oid);
  if (CURRENT_VIEW === 'lis_result') renderLisResults();
}

function approveOrder(oid) {
  const o = STATE.orders.find(x => x.id === oid);
  if (o.items.some(i => i.result_value === '')) return toast('Còn xét nghiệm chưa có kết quả. Không thể duyệt.', 'err');
  o.items.forEach(i => i.status = 'APPROVED');
  o.workflow_status = 'RELEASED';
  addAudit('APPROVE_RELEASE', o.order_code, `Ký duyệt & phát hành kết quả bởi ${CURRENT_USER.full_name}`);
  toast(`Đã ký duyệt & phát hành kết quả phiếu ${o.order_code}!`);
  closeModal();
  if (CURRENT_VIEW === 'lis_result') renderLisResults();
}

// ==== 5. ISO 15189 IQC & LEVEY-JENNINGS ====
function renderIqc(selAn) {
  const analytes = [...new Set(STATE.iqc.map(q => q.analyte))];
  const cur = selAn || analytes[0] || 'Glucose (Sinh hóa)';
  const series = STATE.iqc.filter(q => q.analyte === cur);
  const yOfZ = z => Math.round(105 - Math.max(-3.5, Math.min(3.5, z)) * 26);
  const pts = series.map((r, i) => ({ x: 50 + (series.length <= 1 ? 260 : Math.round(i / (series.length - 1) * 580)), y: yOfZ(r.z), r }));

  document.getElementById('viewContainer').innerHTML = `
    <div class="grid-2">
      <div class="card">
        <div class="card-hdr">
          <span class="card-title">Biểu đồ Levey-Jennings (ISO 15189:2022)</span>
          <select class="form-control" style="max-width:220px;" onchange="renderIqc(this.value)">${analytes.map(a => `<option ${a===cur?'selected':''}>${esc(a)}</option>`).join('')}</select>
        </div>
        <svg viewBox="0 0 670 210" style="width:100%;height:215px;background:var(--surface-2);border-radius:8px;">
          ${[3,2,1,0,-1,-2,-3].map(z => {
            const y = yOfZ(z), col = z===0?'var(--primary)':(Math.abs(z)===3?'#dc2626':(Math.abs(z)===2?'#d97706':'#94a3b8'));
            return `<line x1="42" y1="${y}" x2="650" y2="${y}" stroke="${col}" stroke-dasharray="${z===0?'':'4 3'}" stroke-width="${z===0?1.5:1}"/><text x="6" y="${y+4}" font-size="10" fill="${col}" font-weight="700">${z>0?'+'+z:z}SD</text>`;
          }).join('')}
          ${pts.length > 1 ? `<polyline fill="none" stroke="var(--primary)" stroke-width="2" points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}"/>` : ''}
          ${pts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="5.5" fill="${p.r.st==='PASS'?'#059669':(p.r.st.startsWith('WARN')?'#d97706':'#dc2626')}" stroke="#fff" stroke-width="1.5"><title>${p.r.at}: ${p.r.val} (Z=${p.r.z}, ${p.r.st})</title></circle>`).join('')}
        </svg>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">Ghi nhận Nội kiểm mới (Vendor-Agnostic)</span></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Chỉ số Nội kiểm</label><input id="qAn" class="form-control" value="${esc(cur)}" /></div>
          <div class="form-group"><label class="form-label">Mức Control</label><select id="qLv" class="form-control"><option>Level 1 (Low)</option><option selected>Level 2 (Normal)</option><option>Level 3 (High)</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Target Mean</label><input id="qMn" type="number" step="0.01" class="form-control" value="5.50" /></div>
          <div class="form-group"><label class="form-label">Target SD</label><input id="qSd" type="number" step="0.01" class="form-control" value="0.15" /></div>
          <div class="form-group"><label class="form-label">Giá trị đo</label><input id="qVl" type="number" step="0.01" class="form-control" placeholder="VD: 5.54" /></div>
        </div>
        <button class="btn btn-accent" onclick="addIqc()">Ghi nhận &amp; Đánh giá Westgard</button>
      </div>
    </div>
    <div class="card"><div class="table-wrap"><table class="tbl">
      <thead><tr><th>Thời gian</th><th>Chỉ số</th><th>Mức Control</th><th class="text-right">Mean ± SD</th><th class="text-right">Giá trị đo</th><th class="text-right">Z-Score</th><th>Westgard</th></tr></thead>
      <tbody>${[...STATE.iqc].reverse().map(r => `<tr><td>${esc(r.at)}</td><td><b>${esc(r.analyte)}</b></td><td>${esc(r.level)}</td><td class="text-right">${r.mean} ± ${r.sd}</td><td class="text-right"><b>${r.val}</b></td><td class="text-right"><b>${r.z}</b></td><td>${statusBadge(r.st)}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
}

function addIqc() {
  const mean = Number(document.getElementById('qMn').value), sd = Number(document.getElementById('qSd').value), val = Number(document.getElementById('qVl').value);
  if (!sd || isNaN(val)) return toast('Vui lòng nhập giá trị đo hợp lệ.', 'err');
  const an = document.getElementById('qAn').value.trim(), lv = document.getElementById('qLv').value;
  const z = Math.round(((val - mean) / sd) * 100) / 100;
  const prev = [...STATE.iqc].reverse().find(x => x.analyte === an && x.level === lv);
  let st = 'PASS';
  if (Math.abs(z) >= 3) st = 'REJECT_1_3S';
  else if (prev && Math.abs(z - prev.z) >= 4) st = 'REJECT_R_4S';
  else if (prev && ((z >= 2 && prev.z >= 2) || (z <= -2 && prev.z <= -2))) st = 'REJECT_2_2S';
  else if (Math.abs(z) >= 2) st = 'WARNING_1_2S';
  STATE.iqc.push({ id:Date.now(), analyte:an, level:lv, lot:'QC-2026-L2', mean, sd, val, z, st, by:CURRENT_USER.full_name, at:new Date().toISOString().slice(0,16).replace('T',' ') });
  addAudit('IQC_RUN', an, `Z=${z} (${st})`);
  toast(`Nội kiểm ${an}: Z=${z} (${st})`, st === 'PASS' ? 'ok' : 'err');
  renderIqc(an);
}

function renderAnalyzers() {
  const code = STATE.orders[0]?.order_code || '261121001';
  const sample = `MSH|^~\\&|BIOCHEM_01|LAB|METALAB_LIS|HOSP|202611211135||ORU^R01|MSG01|P|2.5\nPID|1||BN001\nOBR|1|${code}|${code}|PANEL^SinhHoa\nOBX|1|NM|GLU^Glucose||5.4|mmol/L|3.9-6.4|N|||F\nOBX|2|NM|CRE^Creatinin||86|umol/L|62-106|N|||F`;
  document.getElementById('viewContainer').innerHTML = `
    <div class="kpi-grid">${STATE.analyzers.map(a => `<div class="kpi-card teal"><div style="display:flex;justify-content:space-between;"><b>${esc(a.code)}</b><span class="badge b-success">● ${esc(a.st)}</span></div><div style="font-weight:700;margin:5px 0 2px;">${esc(a.name)}</div><div class="kpi-sub">${esc(a.sec)} • ${esc(a.proto)} • ${esc(a.ip)}</div></div>`).join('')}</div>
    <div class="card">
      <div class="card-hdr"><span class="card-title">Bộ Phân tích Bản tin HL7 v2.5 (ORU^R01) Tự động</span></div>
      <textarea id="hl7Box" class="form-control" rows="6" style="font-family:monospace;font-size:12px;margin-bottom:10px;">${esc(sample)}</textarea>
      <button class="btn btn-accent" onclick="parseHl7()">Phân tích &amp; Đổ Kết quả vào LIS</button>
    </div>
    <div class="card"><div class="table-wrap"><table class="tbl">
      <thead><tr><th>Thời gian</th><th>Mã Phiếu</th><th>Loại</th><th>Tóm tắt xử lý</th></tr></thead>
      <tbody>${STATE.hl7Logs.map(m => `<tr><td>${esc(m.at)}</td><td><b>${esc(m.code)}</b></td><td><span class="badge b-info">ORU^R01</span></td><td>${esc(m.msg)}</td></tr>`).join('') || '<tr><td colspan="4" class="text-center muted">Chưa có bản tin HL7. Nhấn nút trên để kiểm thử phân tích trực tiếp.</td></tr>'}</tbody>
    </table></div></div>`;
}

function parseHl7() {
  const lines = document.getElementById('hl7Box').value.trim().split(/\r?\n/);
  let ocode = ''; const obx = [];
  lines.forEach(ln => {
    const p = ln.split('|');
    if (p[0] === 'OBR') ocode = p[2] || p[3] || '';
    if (p[0] === 'OBX' && p[5]) { const id = (p[3]||'').split('^'); obx.push([id[1]||id[0], p[5]]); }
  });
  const o = STATE.orders.find(x => x.order_code === ocode);
  if (!o) return toast(`Không tìm thấy phiếu mã ${ocode}.`, 'err');
  let m = 0;
  obx.forEach(([k, v]) => {
    const it = o.items.find(i => i.name.toLowerCase().includes(k.toLowerCase()) || i.code.toLowerCase() === k.toLowerCase());
    if (it) { it.result_value = v; it.abnormal_flag = evalFlag(v, it.test_id); it.analyzer = 'HL7 Auto-Interface'; it.status = 'ANALYZED'; m++; }
  });
  if (m > 0 && ['REGISTERED','COLLECTED'].includes(o.workflow_status)) o.workflow_status = 'IN_PROGRESS';
  const msg = `Phiếu ${ocode}: Khớp tự động ${m}/${obx.length} chỉ số từ bản tin HL7`;
  STATE.hl7Logs.unshift({ at:new Date().toISOString().slice(0,16).replace('T',' '), code:ocode, msg });
  addAudit('HL7_INGEST', ocode, msg);
  toast(msg);
  renderAnalyzers();
}

function renderPartnerPicker() {
  const q = (document.getElementById('ptpQ')?.value || '').toLowerCase().trim();

  const sel = new Set(P_CART.map(x => x.id));
  const list = CATALOG.tests.filter(t => (!gid || String(t.gid) === gid) && (!q || t.name.toLowerCase().includes(q) || t.code.toLowerCase().includes(q))).slice(0, 90);
  document.getElementById('ptpList').innerHTML = list.map(t => {
    const g = getGroup(t.gid);
    return `<div class="pick-row ${sel.has(t.id)?'sel':''}" onclick="togglePartnerCart(${t.id})">
      <div><b>${esc(t.name)}</b> <span class="badge b-neutral">${esc(t.code)}</span><div class="muted" style="font-size:11px;">${esc(g.name)} • Ống ${esc(g.tube)}</div></div>
      <div class="text-right"><b style="color:var(--primary);">${fmtM(Math.round(t.price*(1-t.disc)))}</b><div class="muted" style="font-size:11px;text-decoration:line-through;">${fmtM(t.price)}</div></div>
    </div>`;
  }).join('');
}

function togglePartnerCart(id) {
  const i = P_CART.findIndex(x => x.id === id);
  if (i >= 0) P_CART.splice(i, 1); else { const t = CATALOG.tests.find(x => x.id === id); if (t) P_CART.push({ ...t }); }
  renderPartnerCart(); renderPartnerPicker();
}

function applyPartnerPkg(pid) {
  CATALOG.tests.filter(t => t.pkgs.includes(pid)).forEach(t => { if (!P_CART.some(x => x.id === t.id)) P_CART.push({ ...t }); });
  renderPartnerCart(); renderPartnerPicker();
  toast('Đã nạp trọn bộ xét nghiệm trong gói khám.');
}

function renderPartnerCart() {
  let gross = 0, net = 0; const tubes = new Set();
  document.getElementById('pcBody').innerHTML = P_CART.map(t => {
    const g = getGroup(t.gid), ln = Math.round(t.price * (1 - t.disc));
    gross += t.price; net += ln; tubes.add(`${g.tube} (${g.name})`);
    return `<tr><td><b>${esc(t.name)}</b></td><td><span class="badge b-info">${esc(g.tube)}</span></td><td class="text-right">${fmtM(t.price)}</td><td class="text-right"><b>${fmtM(ln)}</b></td><td><button class="btn btn-outline btn-sm" onclick="togglePartnerCart(${t.id})">✕</button></td></tr>`;
  }).join('') || '<tr><td colspan="5" class="text-center muted" style="padding:14px;">Chưa chọn xét nghiệm.</td></tr>';
  document.getElementById('pcCnt').textContent = P_CART.length;
  document.getElementById('pcGross').textContent = fmtM(gross);
  document.getElementById('pcNet').textContent = fmtM(net);
  document.getElementById('tubeGuide').innerHTML = tubes.size ? `<div style="font-size:12px;background:var(--surface-2);padding:8px 10px;border-radius:7px;"><b>Hướng dẫn Lấy mẫu cho Điều dưỡng đối tác:</b> Chuẩn bị ống ${[...tubes].join(', ')} • Bảo quản lạnh 2-8°C trước khi giao mẫu.</div>` : '';
}

function submitPartnerOrder() {
  if (!document.getElementById('peConsent').checked) return toast('Bắt buộc xác nhận đồng thuận bệnh nhân theo Nghị định 13/2023/NĐ-CP.', 'err');
  const name = document.getElementById('peName').value.trim();
  if (!name || !P_CART.length) return toast('Vui lòng nhập họ tên bệnh nhân và chọn ít nhất 1 xét nghiệm.', 'err');

  const pid = STATE.patients.length + 1;
  STATE.patients.unshift({ id:pid, code:`BN2611${String(pid).padStart(3,'0')}`, full_name:name, birth_year:Number(document.getElementById('peYear').value)||null, gender:document.getElementById('peGen').value, phone:document.getElementById('pePhone').value.trim(), cccd:'', address:'', history:'' });
  const code = '261121' + String(STATE.orders.length + 1).padStart(3, '0');
  const tok = Math.random().toString(36).slice(2, 10).toUpperCase();
  const items = P_CART.map(t => ({ id:Math.floor(Math.random()*1e9), test_id:t.id, code:t.code, name:t.name, gid:t.gid, list_price:t.price, discount_rate:t.disc, net_price:Math.round(t.price*(1-t.disc)), result_value:'', unit:t.unit, ref_range:t.ref, abnormal_flag:'', analyzer:'', status:'PENDING' }));
  const tubes = [...new Set(items.map(i => getGroup(i.gid).tube))];
  const specimens = tubes.map((tb, idx) => ({ id:Math.floor(Math.random()*1e9), barcode:`SP-${code}-0${idx+1}`, tube:tb, color:(CATALOG.groups.find(g=>g.tube===tb)||{}).color||'#DC2626', status:'PENDING', by:'', tat:'2026-11-21 16:00' }));
  const newOrd = {
    id:STATE.orders.length+1, order_code:code, patient_id:pid, doctor_id:CURRENT_USER.doctor_id||1, clinic_id:CURRENT_USER.clinic_id||1,
    order_date:new Date().toISOString().slice(0,16).replace('T',' '), diagnosis:document.getElementById('peDiag').value.trim(), icd10:'',
    priority:document.getElementById('pePrio').value, payment_method:'DEBT', payment_status:'UNPAID', workflow_status:'REGISTERED',
    lookup_token:tok, total_list:items.reduce((s,i)=>s+i.list_price,0), total_net:items.reduce((s,i)=>s+i.net_price,0), paid_amount:0,
    created_by:CURRENT_USER.full_name, items, specimens
  };
  STATE.orders.unshift(newOrd);
  P_CART = [];
  addAudit('PARTNER_EORDER', code, `Đặt e-Order B2B ${code} (đã xác nhận đồng thuận NĐ 13/2023)`);

  renderPartnerOrder();

function labPickupAct(id, st) {
  const p = STATE.pickups.find(x => x.id === id);
  if (!p) return;
  p.st = st; if (st === 'DISPATCHED') p.courier = 'NV Giao nhận 01';
  addAudit('LAB_PICKUP_' + st, p.code, `Lab cập nhật lệnh ${p.code} -> ${st}`);
  toast(`Đã cập nhật lệnh lấy mẫu ${p.code} -> ${st}`);
  renderOutreachHub();
}

function labAddonAct(id, dec) {
  const a = STATE.addons.find(x => x.id === id);
  if (!a) return;
  a.st = dec;
  if (dec === 'APPROVED') {
    const o = STATE.orders.find(x => x.id === a.order_id);
    const t = CATALOG.tests.find(x => x.id === a.test_id);
    if (o && t) {
      const net = Math.round(t.price * (1 - t.disc));
      o.items.push({ id:Date.now(), test_id:t.id, code:t.code, name:t.name, gid:t.gid, list_price:t.price, discount_rate:t.disc, net_price:net, result_value:'', unit:t.unit, ref_range:t.ref, abnormal_flag:'', analyzer:'', status:'COLLECTED' });
      o.total_list += t.price; o.total_net += net;
    }
  }
  addAudit('LAB_ADDON_' + dec, a.order_code, `Duyệt XN bổ sung ${a.test_name}: ${dec}`);
  toast(`Đã xử lý yêu cầu XN bổ sung (${dec}).`);
  renderOutreachHub();
}

function labReplyConsult(id) {
  const c = STATE.consults.find(x => x.id === id);
  const val = document.getElementById('rep_' + id)?.value.trim();
  if (!c || !val) return;
  c.reply = val; c.replied_by = CURRENT_USER.full_name; c.st = 'ANSWERED';
  addAudit('LAB_REPLY_CONSULT', 'CONSULT', c.subject);
  toast('Đã gửi phản hồi hội chẩn tới Bác sĩ đối tác.');
  renderOutreachHub();
}

// ==== GOOGLE CLOUD DUAL-TRANSPORT BRIDGE (GAS Native + GitHub Pages HTTPS) ====
let CLOUD_TOKEN = '';

async function cloudRpc(action, payload = {}) {
  // Mode A: Native Google Apps Script HtmlService
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error(err.message || String(err))))
        .apiCall(action, payload, CLOUD_TOKEN);
    });
  }
  // Mode B: GitHub Pages -> GAS Web App HTTPS POST (CORS-safe text/plain)
  const url = (STATE.settings.gas_url || '').trim();
  if (url && url.startsWith('https://script.google.com/')) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload, token: CLOUD_TOKEN }),
    });
    return await res.json();
  }
  return null; // Local offline mode
}

async function syncGoogleCloud() {
  const url = (STATE.settings.gas_url || '').trim();
  const isGasNative = (typeof google !== 'undefined' && google.script && google.script.run);
  if (!isGasNative && !url) {
    toast('Chế độ cục bộ: Dán Google Apps Script Web App URL trong mục Quản trị để đồng bộ 2 chiều với Google Sheets MasterDB.', 'ok');
    return;
  }
  try {
    toast('Đang đồng bộ dữ liệu với Google Sheets MasterDB...', 'ok');
    if (!CLOUD_TOKEN && CURRENT_USER) {
      const lr = await cloudRpc('login', { username: CURRENT_USER.username, password: CURRENT_USER.pass });
      if (lr && lr.ok) CLOUD_TOKEN = lr.token;
    }
    const r = await cloudRpc('sync_pull', {});
    if (r && r.ok) {
      addAudit('CLOUD_SYNC', 'MASTERDB', `Đồng bộ thành công với Google Sheets (${r.synced_at})`);
      toast(`Đồng bộ Dữ liệu thành công (${r.synced_at})!`);
    } else {
      toast((r && r.error) || 'Không thể đồng bộ Google Cloud.', 'err');
    }
  } catch (e) {
    toast('Lỗi kết nối Google Cloud: ' + e.message, 'err');
  }
}

function renderPartnerPicker() {
  const q = (document.getElementById('ptpQ')?.value || '').toLowerCase().trim();
  const gid = document.getElementById('ptpG')?.value || '';
  const sel = new Set(P_CART.map(x => x.id));
  const list = CATALOG.tests.filter(t => (!gid || String(t.gid) === gid) && (!q || t.name.toLowerCase().includes(q) || t.code.toLowerCase().includes(q))).slice(0, 90);
  document.getElementById('ptpList').innerHTML = list.map(t => {
    const g = getGroup(t.gid);
    return `<div class="pick-row ${sel.has(t.id)?'sel':''}" onclick="togglePartnerCart(${t.id})">
      <div><b>${esc(t.name)}</b> <span class="badge b-neutral">${esc(t.code)}</span><div class="muted" style="font-size:11px;">${esc(g.name)} • Ống ${esc(g.tube)}</div></div>
      <div class="text-right"><b style="color:var(--primary);">${fmtM(Math.round(t.price*(1-t.disc)))}</b><div class="muted" style="font-size:11px;text-decoration:line-through;">${fmtM(t.price)}</div></div>
    </div>`;
  }).join('');
}

function togglePartnerCart(id) {
  const i = P_CART.findIndex(x => x.id === id);
  if (i >= 0) P_CART.splice(i, 1); else { const t = CATALOG.tests.find(x => x.id === id); if (t) P_CART.push({ ...t }); }
  renderPartnerCart(); renderPartnerPicker();
}

function applyPartnerPkg(pid) {
  CATALOG.tests.filter(t => t.pkgs.includes(pid)).forEach(t => { if (!P_CART.some(x => x.id === t.id)) P_CART.push({ ...t }); });
  renderPartnerCart(); renderPartnerPicker();
  toast('Đã nạp trọn bộ xét nghiệm trong gói khám.');
}

function renderPartnerCart() {
  let gross = 0, net = 0; const tubes = new Set();
  document.getElementById('pcBody').innerHTML = P_CART.map(t => {
    const g = getGroup(t.gid), ln = Math.round(t.price * (1 - t.disc));
    gross += t.price; net += ln; tubes.add(`${g.tube} (${g.name})`);
    return `<tr><td><b>${esc(t.name)}</b></td><td><span class="badge b-info">${esc(g.tube)}</span></td><td class="text-right">${fmtM(t.price)}</td><td class="text-right"><b>${fmtM(ln)}</b></td><td><button class="btn btn-outline btn-sm" onclick="togglePartnerCart(${t.id})">✕</button></td></tr>`;
  }).join('') || '<tr><td colspan="5" class="text-center muted" style="padding:14px;">Chưa chọn xét nghiệm.</td></tr>';
  document.getElementById('pcCnt').textContent = P_CART.length;
  document.getElementById('pcGross').textContent = fmtM(gross);
  document.getElementById('pcNet').textContent = fmtM(net);
  document.getElementById('tubeGuide').innerHTML = tubes.size ? `<div style="font-size:12px;background:var(--surface-2);padding:8px 10px;border-radius:7px;"><b>Hướng dẫn Lấy mẫu cho Điều dưỡng đối tác:</b> Chuẩn bị ống ${[...tubes].join(', ')} • Bảo quản lạnh 2-8°C trước khi giao mẫu.</div>` : '';
}

function submitPartnerOrder() {
  if (!document.getElementById('peConsent').checked) return toast('Bắt buộc xác nhận đồng thuận bệnh nhân theo Nghị định 13/2023/NĐ-CP.', 'err');
  const name = document.getElementById('peName').value.trim();
  if (!name || !P_CART.length) return toast('Vui lòng nhập họ tên bệnh nhân và chọn ít nhất 1 xét nghiệm.', 'err');

  const pid = STATE.patients.length + 1;
  STATE.patients.unshift({ id:pid, code:`BN2611${String(pid).padStart(3,'0')}`, full_name:name, birth_year:Number(document.getElementById('peYear').value)||null, gender:document.getElementById('peGen').value, phone:document.getElementById('pePhone').value.trim(), cccd:'', address:'', history:'' });
  const code = '261121' + String(STATE.orders.length + 1).padStart(3, '0');
  const tok = Math.random().toString(36).slice(2, 10).toUpperCase();
  const items = P_CART.map(t => ({ id:Math.floor(Math.random()*1e9), test_id:t.id, code:t.code, name:t.name, gid:t.gid, list_price:t.price, discount_rate:t.disc, net_price:Math.round(t.price*(1-t.disc)), result_value:'', unit:t.unit, ref_range:t.ref, abnormal_flag:'', analyzer:'', status:'PENDING' }));
  const tubes = [...new Set(items.map(i => getGroup(i.gid).tube))];
  const specimens = tubes.map((tb, idx) => ({ id:Math.floor(Math.random()*1e9), barcode:`SP-${code}-0${idx+1}`, tube:tb, color:(CATALOG.groups.find(g=>g.tube===tb)||{}).color||'#DC2626', status:'PENDING', by:'', tat:'2026-11-21 16:00' }));
  const newOrd = {
    id:STATE.orders.length+1, order_code:code, patient_id:pid, doctor_id:CURRENT_USER.doctor_id||1, clinic_id:CURRENT_USER.clinic_id||1,
    order_date:new Date().toISOString().slice(0,16).replace('T',' '), diagnosis:document.getElementById('peDiag').value.trim(), icd10:'',
    priority:document.getElementById('pePrio').value, payment_method:'DEBT', payment_status:'UNPAID', workflow_status:'REGISTERED',
    lookup_token:tok, total_list:items.reduce((s,i)=>s+i.list_price,0), total_net:items.reduce((s,i)=>s+i.net_price,0), paid_amount:0,
    created_by:CURRENT_USER.full_name, items, specimens
  };
  STATE.orders.unshift(newOrd);
  P_CART = [];
  addAudit('PARTNER_EORDER', code, `Đặt e-Order B2B ${code} (đã xác nhận đồng thuận NĐ 13/2023)`);
  toast(`Đã gửi e-Order ${code} thành công!`);
  openPrintSlip(newOrd.id, 'order');
  renderPartnerOrder();
}

function labPickupAct(id, st) {
  const p = STATE.pickups.find(x => x.id === id);
  if (!p) return;
  p.st = st; if (st === 'DISPATCHED') p.courier = 'NV Giao nhận 01';
  addAudit('LAB_PICKUP_' + st, p.code, `Lab cập nhật lệnh ${p.code} -> ${st}`);
  toast(`Đã cập nhật lệnh lấy mẫu ${p.code} -> ${st}`);
  renderOutreachHub();
}

function labAddonAct(id, dec) {
  const a = STATE.addons.find(x => x.id === id);
  if (!a) return;
  a.st = dec;
  if (dec === 'APPROVED') {
    const o = STATE.orders.find(x => x.id === a.order_id);
    const t = CATALOG.tests.find(x => x.id === a.test_id);
    if (o && t) {
      const net = Math.round(t.price * (1 - t.disc));
      o.items.push({ id:Date.now(), test_id:t.id, code:t.code, name:t.name, gid:t.gid, list_price:t.price, discount_rate:t.disc, net_price:net, result_value:'', unit:t.unit, ref_range:t.ref, abnormal_flag:'', analyzer:'', status:'COLLECTED' });
      o.total_list += t.price; o.total_net += net;
    }
  }
  addAudit('LAB_ADDON_' + dec, a.order_code, `Duyệt XN bổ sung ${a.test_name}: ${dec}`);
  toast(`Đã xử lý yêu cầu XN bổ sung (${dec}).`);
  renderOutreachHub();
}

function labReplyConsult(id) {
  const c = STATE.consults.find(x => x.id === id);
  const val = document.getElementById('rep_' + id)?.value.trim();
  if (!c || !val) return;
  c.reply = val; c.replied_by = CURRENT_USER.full_name; c.st = 'ANSWERED';
  addAudit('LAB_REPLY_CONSULT', 'CONSULT', c.subject);
  toast('Đã gửi phản hồi hội chẩn tới Bác sĩ đối tác.');
  renderOutreachHub();
}

// ==== GOOGLE CLOUD DUAL-TRANSPORT BRIDGE (GAS Native + GitHub Pages HTTPS) ====
let CLOUD_TOKEN = '';

async function cloudRpc(action, payload = {}) {
  // Mode A: Native Google Apps Script HtmlService
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error(err.message || String(err))))
        .apiCall(action, payload, CLOUD_TOKEN);
    });
  }
  // Mode B: GitHub Pages -> GAS Web App HTTPS POST (CORS-safe text/plain)
  const url = (STATE.settings.gas_url || '').trim();
  if (url && url.startsWith('https://script.google.com/')) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload, token: CLOUD_TOKEN }),
    });
    return await res.json();
  }
  return null; // Local offline mode
}

async function syncGoogleCloud() {
  const url = (STATE.settings.gas_url || '').trim();
  const isGasNative = (typeof google !== 'undefined' && google.script && google.script.run);
  if (!isGasNative && !url) {
    toast('Chế độ cục bộ: Dán Google Apps Script Web App URL trong mục Quản trị để đồng bộ 2 chiều với Google Sheets MasterDB.', 'ok');
    return;
  }
  try {
    toast('Đang đồng bộ dữ liệu với Google Sheets MasterDB...', 'ok');
    if (!CLOUD_TOKEN && CURRENT_USER) {
      const lr = await cloudRpc('login', { username: CURRENT_USER.username, password: CURRENT_USER.pass });
      if (lr && lr.ok) CLOUD_TOKEN = lr.token;
    }
    const r = await cloudRpc('sync_pull', {});
    if (r && r.ok) {
      addAudit('CLOUD_SYNC', 'MASTERDB', `Đồng bộ thành công với Google Sheets (${r.synced_at})`);
      toast(`Đồng bộ Dữ liệu thành công (${r.synced_at})!`);
    } else {
      toast((r && r.error) || 'Không thể đồng bộ Google Cloud.', 'err');
    }
  } catch (e) {
    toast('Lỗi kết nối Google Cloud: ' + e.message, 'err');
  }
}

applyAppearance();

// ==== PATIENT QR PORTAL, GLOBAL SEARCH, NOTIFICATIONS, ONBOARDING ====
function openPortalModal() {
  openModal('Cổng Tra cứu Kết quả Xét nghiệm Bệnh nhân (QR)', `
    <div class="form-row">
      <div class="form-group"><label class="form-label">Mã Phiếu Khám</label><input id="ptCode" class="form-control" placeholder="VD: 261119001" /></div>
      <div class="form-group"><label class="form-label">Mã Tra cứu QR</label><input id="ptTok" class="form-control" placeholder="In trên phiếu chỉ định" /></div>
    </div>
    <button class="btn btn-accent" onclick="doPortalLookup()">Tra cứu Kết quả</button>
    <div id="ptRes" style="margin-top:12px;"></div>`, true);
}

function doPortalLookup() {
  const c = document.getElementById('ptCode').value.trim();
  const t = document.getElementById('ptTok').value.trim().toUpperCase();
  const o = STATE.orders.find(x => x.order_code === c && x.lookup_token.toUpperCase() === t);
  const box = document.getElementById('ptRes');
  if (!o) { box.innerHTML = '<span class="badge b-danger">Mã phiếu hoặc mã QR không chính xác.</span>'; return; }
  box.innerHTML = `
    <div style="background:var(--surface-2);padding:10px;border-radius:8px;margin-bottom:10px;">
      <b>Bệnh nhân:</b> ${esc(getPatient(o.patient_id).full_name)} • <b>Ngày:</b> ${esc(o.order_date)} • ${statusBadge(o.workflow_status)}
    </div>
    <table class="tbl"><thead><tr><th>Xét nghiệm</th><th>Kết quả</th><th>Đơn vị</th><th>Tham chiếu</th><th>Cờ</th></tr></thead>
    <tbody>${o.items.map(i => `<tr><td><b>${esc(i.name)}</b></td><td><b>${o.workflow_status==='RELEASED'?esc(i.result_value):'Đang chờ duyệt'}</b></td><td>${esc(i.unit)}</td><td>${esc(i.ref_range)}</td><td>${o.workflow_status==='RELEASED'?esc(i.abnormal_flag||'-'):'-'}</td></tr>`).join('')}</tbody></table>`;
}

function openGlobalSearch() {
  openModal('Tìm kiếm Toàn cục (Ctrl + K)', `
    <input id="gsQ" class="form-control" placeholder="Gõ mã phiếu, tên bệnh nhân, tên xét nghiệm trong 353 DVXN..." oninput="runGs(this.value)" />
    <div id="gsOut" style="margin-top:12px;"></div>`, true);
  setTimeout(() => document.getElementById('gsQ')?.focus(), 50);
}

function runGs(q) {
  const s = q.toLowerCase().trim();
  const out = document.getElementById('gsOut');
  if (s.length < 2) { out.innerHTML = '<div class="muted">Nhập ít nhất 2 ký tự để tìm...</div>'; return; }
  const ords = STATE.orders.filter(o => o.order_code.includes(s) || getPatient(o.patient_id).full_name.toLowerCase().includes(s)).slice(0, 6);
  const tsts = CATALOG.tests.filter(t => t.name.toLowerCase().includes(s) || t.code.toLowerCase().includes(s)).slice(0, 8);
  out.innerHTML = `<div class="grid-2">
    <div><b class="muted" style="font-size:11.5px;">PHIẾU KHÁM (${ords.length})</b>${ords.map(o=>`<div class="pick-row" onclick="closeModal();openResultModal(${o.id})"><span><b>${esc(o.order_code)}</b> — ${esc(getPatient(o.patient_id).full_name)}</span>${statusBadge(o.workflow_status)}</div>`).join('') || '<div class="muted" style="padding:6px;">Không có</div>'}</div>
    <div><b class="muted" style="font-size:11.5px;">DỊCH VỤ XÉT NGHIỆM (${tsts.length})</b>${tsts.map(t=>`<div class="pick-row" onclick="closeModal();navigate('orders')"><span><b>${esc(t.code)}</b> — ${esc(t.name)}</span><b>${fmtM(t.price)}</b></div>`).join('') || '<div class="muted" style="padding:6px;">Không có</div>'}</div>
  </div>`;
}

function openNotifications() {
  const alerts = getAlertsList();
  openModal(`Trung tâm Cảnh báo Lâm sàng & Kho (${alerts.length})`, alerts.length ? alerts.map(a => `
    <div class="pick-row" onclick="closeModal();navigate('${a.view}')">
      <div><span class="badge b-${a.type}">${esc(a.title)}</span><div style="margin-top:3px;">${esc(a.msg)}</div></div>
      <span class="btn btn-outline btn-sm">Xử lý →</span>
    </div>`).join('') : '<div class="muted">Hệ thống ổn định, không có cảnh báo tồn đọng.</div>');
}

const TOUR_STEPS = [
  ['1. Đăng ký khám & 353 Dịch vụ XN', 'Mở phân hệ Đăng ký khám & Chỉ định để chọn 1-click trong 8 Gói XN chuẩn hoặc tìm trực tiếp 353 xét nghiệm thật từ Access ATS, tự động tính chiết khấu và sinh mã Barcode ống mẫu.', 'orders'],
  ['2. Tiền phân tích LIS (Barcode)', 'Theo dõi hàng đợi ống mẫu (EDTA, Serum, Urine...), thao tác Lấy mẫu → Nhận Lab → Từ chối mẫu (có lý do) → Lưu kho.', 'lis_specimen'],
  ['3. Nhập & Duyệt Kết quả XN', 'Nhập kết quả lâm sàng với tự động gắn cờ H/L/HH/LL (Nguy kịch), ký duyệt phát hành 2 bước và xuất Phiếu Kết quả A4 kèm mã tra cứu QR.', 'lis_result'],
  ['4. Nội kiểm IQC & Westgard (ISO 15189)', 'Ghi nhận nội kiểm trung lập hãng, tính Z-score tự động, phát hiện vi phạm Westgard (1-2s, 1-3s, 2-2s, R-4s) và xem biểu đồ Levey-Jennings.', 'iqc'],
  ['5. Kết nối Máy XN HL7 v2.5', 'Thử dán bản tin HL7 ORU^R01 để hệ thống tự động khớp mã phiếu và đổ kết quả trực tiếp vào LIS.', 'analyzers'],
  ['6. Báo cáo, Thu ngân & White-Label', 'Đối soát công nợ phòng khám, xuất báo cáo Excel/CSV, đổi 4 bảng màu y khoa, 3 mật độ hiển thị và Lab Dark Mode (Alt+D).', 'admin'],
];

function openOnboardingTour(idx) {
  const [title, desc, view] = TOUR_STEPS[idx];
  openModal(`Hướng dẫn Trải nghiệm (${idx + 1}/${TOUR_STEPS.length}): ${title}`, `
    <p style="margin-bottom:16px;line-height:1.6;">${desc}</p>
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="closeModal();navigate('${view}')">Mở phân hệ này ngay</button>
      <div style="display:flex;gap:8px;">
        ${idx > 0 ? `<button class="btn btn-outline" onclick="openOnboardingTour(${idx-1})">← Trước</button>` : ''}
        ${idx < TOUR_STEPS.length - 1 ? `<button class="btn btn-primary" onclick="openOnboardingTour(${idx+1})">Tiếp theo →</button>` : `<button class="btn btn-accent" onclick="closeModal()">Hoàn tất</button>`}
      </div>
    </div>`);
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { if (CURRENT_USER) { e.preventDefault(); openGlobalSearch(); } }
  else if (e.altKey && e.key.toLowerCase() === 'd') { e.preventDefault(); toggleDarkMode(); }
  else if (e.altKey && e.key.toLowerCase() === 's') { if (CURRENT_USER) { e.preventDefault(); toggleSidebar(); } }
  else if (e.key === '?' && CURRENT_USER && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) { openOnboardingTour(0); }
  else if (e.key === 'Escape') { closeModal(); }
});

function ackCritPartner(itemId, orderCode) {
  STATE.critAcks[itemId] = { by: CURRENT_USER.full_name, at: new Date().toISOString().slice(0,16).replace('T',' ') };
  addAudit('ACK_CRITICAL_VALUE', orderCode, `Bác sĩ xác nhận tiếp nhận giá trị nguy kịch (ISO 15189)`);
  toast(`Đã xác nhận tiếp nhận cảnh báo nguy kịch cho phiếu ${orderCode}.`);
  if (CURRENT_VIEW === 'p_dash') renderPartnerDash(); else renderPartnerResults();
}

function renderPartnerPicker() {
  const q = (document.getElementById('ptpQ')?.value || '').toLowerCase().trim();
  const gid = document.getElementById('ptpG')?.value || '';
  const sel = new Set(P_CART.map(x => x.id));
  const list = CATALOG.tests.filter(t => (!gid || String(t.gid) === gid) && (!q || t.name.toLowerCase().includes(q) || t.code.toLowerCase().includes(q))).slice(0, 90);
  document.getElementById('ptpList').innerHTML = list.map(t => {
    const g = getGroup(t.gid);
    return `<div class="pick-row ${sel.has(t.id)?'sel':''}" onclick="togglePartnerCart(${t.id})">
      <div><b>${esc(t.name)}</b> <span class="badge b-neutral">${esc(t.code)}</span><div class="muted" style="font-size:11px;">${esc(g.name)} • Ống ${esc(g.tube)}</div></div>
      <div class="text-right"><b style="color:var(--primary);">${fmtM(Math.round(t.price*(1-t.disc)))}</b><div class="muted" style="font-size:11px;text-decoration:line-through;">${fmtM(t.price)}</div></div>
    </div>`;
  }).join('');
}

function togglePartnerCart(id) {
  const i = P_CART.findIndex(x => x.id === id);
  if (i >= 0) P_CART.splice(i, 1); else { const t = CATALOG.tests.find(x => x.id === id); if (t) P_CART.push({ ...t }); }
  renderPartnerCart(); renderPartnerPicker();
}

function applyPartnerPkg(pid) {
  CATALOG.tests.filter(t => t.pkgs.includes(pid)).forEach(t => { if (!P_CART.some(x => x.id === t.id)) P_CART.push({ ...t }); });
  renderPartnerCart(); renderPartnerPicker();
  toast('Đã nạp trọn bộ xét nghiệm trong gói khám.');
}

function renderPartnerCart() {
  let gross = 0, net = 0; const tubes = new Set();
  document.getElementById('pcBody').innerHTML = P_CART.map(t => {
    const g = getGroup(t.gid), ln = Math.round(t.price * (1 - t.disc));
    gross += t.price; net += ln; tubes.add(`${g.tube} (${g.name})`);
    return `<tr><td><b>${esc(t.name)}</b></td><td><span class="badge b-info">${esc(g.tube)}</span></td><td class="text-right">${fmtM(t.price)}</td><td class="text-right"><b>${fmtM(ln)}</b></td><td><button class="btn btn-outline btn-sm" onclick="togglePartnerCart(${t.id})">✕</button></td></tr>`;
  }).join('') || '<tr><td colspan="5" class="text-center muted" style="padding:14px;">Chưa chọn xét nghiệm.</td></tr>';
  document.getElementById('pcCnt').textContent = P_CART.length;
  document.getElementById('pcGross').textContent = fmtM(gross);
  document.getElementById('pcNet').textContent = fmtM(net);
  document.getElementById('tubeGuide').innerHTML = tubes.size ? `<div style="font-size:12px;background:var(--surface-2);padding:8px 10px;border-radius:7px;"><b>Hướng dẫn Lấy mẫu cho Điều dưỡng đối tác:</b> Chuẩn bị ống ${[...tubes].join(', ')} • Bảo quản lạnh 2-8°C trước khi giao mẫu.</div>` : '';
}

function submitPartnerOrder() {
  if (!document.getElementById('peConsent').checked) return toast('Bắt buộc xác nhận đồng thuận bệnh nhân theo Nghị định 13/2023/NĐ-CP.', 'err');
  const name = document.getElementById('peName').value.trim();
  if (!name || !P_CART.length) return toast('Vui lòng nhập họ tên bệnh nhân và chọn ít nhất 1 xét nghiệm.', 'err');

  const pid = STATE.patients.length + 1;
  STATE.patients.unshift({ id:pid, code:`BN2611${String(pid).padStart(3,'0')}`, full_name:name, birth_year:Number(document.getElementById('peYear').value)||null, gender:document.getElementById('peGen').value, phone:document.getElementById('pePhone').value.trim(), cccd:'', address:'', history:'' });
  const code = '261121' + String(STATE.orders.length + 1).padStart(3, '0');
  const tok = Math.random().toString(36).slice(2, 10).toUpperCase();
  const items = P_CART.map(t => ({ id:Math.floor(Math.random()*1e9), test_id:t.id, code:t.code, name:t.name, gid:t.gid, list_price:t.price, discount_rate:t.disc, net_price:Math.round(t.price*(1-t.disc)), result_value:'', unit:t.unit, ref_range:t.ref, abnormal_flag:'', analyzer:'', status:'PENDING' }));
  const tubes = [...new Set(items.map(i => getGroup(i.gid).tube))];
  const specimens = tubes.map((tb, idx) => ({ id:Math.floor(Math.random()*1e9), barcode:`SP-${code}-0${idx+1}`, tube:tb, color:(CATALOG.groups.find(g=>g.tube===tb)||{}).color||'#DC2626', status:'PENDING', by:'', tat:'2026-11-21 16:00' }));
  const newOrd = {
    id:STATE.orders.length+1, order_code:code, patient_id:pid, doctor_id:CURRENT_USER.doctor_id||1, clinic_id:CURRENT_USER.clinic_id||1,
    order_date:new Date().toISOString().slice(0,16).replace('T',' '), diagnosis:document.getElementById('peDiag').value.trim(), icd10:'',
    priority:document.getElementById('pePrio').value, payment_method:'DEBT', payment_status:'UNPAID', workflow_status:'REGISTERED',
    lookup_token:tok, total_list:items.reduce((s,i)=>s+i.list_price,0), total_net:items.reduce((s,i)=>s+i.net_price,0), paid_amount:0,
    created_by:CURRENT_USER.full_name, items, specimens
  };
  STATE.orders.unshift(newOrd);
  P_CART = [];
  addAudit('PARTNER_EORDER', code, `Đặt e-Order B2B ${code} (đã xác nhận đồng thuận NĐ 13/2023)`);
  toast(`Đã gửi e-Order ${code} thành công!`);
  openPrintSlip(newOrd.id, 'order');
  renderPartnerOrder();
}

function labPickupAct(id, st) {
  const p = STATE.pickups.find(x => x.id === id);
  if (!p) return;
  p.st = st; if (st === 'DISPATCHED') p.courier = 'NV Giao nhận 01';
  addAudit('LAB_PICKUP_' + st, p.code, `Lab cập nhật lệnh ${p.code} -> ${st}`);
  toast(`Đã cập nhật lệnh lấy mẫu ${p.code} -> ${st}`);
  renderOutreachHub();
}

function labAddonAct(id, dec) {
  const a = STATE.addons.find(x => x.id === id);
  if (!a) return;
  a.st = dec;
  if (dec === 'APPROVED') {
    const o = STATE.orders.find(x => x.id === a.order_id);
    const t = CATALOG.tests.find(x => x.id === a.test_id);
    if (o && t) {
      const net = Math.round(t.price * (1 - t.disc));
      o.items.push({ id:Date.now(), test_id:t.id, code:t.code, name:t.name, gid:t.gid, list_price:t.price, discount_rate:t.disc, net_price:net, result_value:'', unit:t.unit, ref_range:t.ref, abnormal_flag:'', analyzer:'', status:'COLLECTED' });
      o.total_list += t.price; o.total_net += net;
    }
  }
  addAudit('LAB_ADDON_' + dec, a.order_code, `Duyệt XN bổ sung ${a.test_name}: ${dec}`);
  toast(`Đã xử lý yêu cầu XN bổ sung (${dec}).`);
  renderOutreachHub();
}

function labReplyConsult(id) {
  const c = STATE.consults.find(x => x.id === id);
  const val = document.getElementById('rep_' + id)?.value.trim();
  if (!c || !val) return;
  c.reply = val; c.replied_by = CURRENT_USER.full_name; c.st = 'ANSWERED';
  addAudit('LAB_REPLY_CONSULT', 'CONSULT', c.subject);
  toast('Đã gửi phản hồi hội chẩn tới Bác sĩ đối tác.');
  renderOutreachHub();
}

function saveClinicForm(id) {
  const code = document.getElementById('fClCode').value.trim(), name = document.getElementById('fClName').value.trim();
  if (!code || !name) return toast('Vui lòng nhập Mã và Tên phòng khám.', 'err');
  const data = {
    code, name, rep:document.getElementById('fClRep').value.trim(), phone:document.getElementById('fClPhone').value.trim(),
    tax:document.getElementById('fClTax').value.trim(), addr:document.getElementById('fClAddr').value.trim(),
    disc:Number(document.getElementById('fClDisc').value)||0, credit_limit:Number(document.getElementById('fClLim').value)||0
  };
  if (id) {
    const old = STATE.clinics.find(x => x.id === id);
    const diff = `Tên: "${old.name}" → "${data.name}"; CK: ${old.disc}% → ${data.disc}%; HM: ${fmtM(old.credit_limit)} → ${fmtM(data.credit_limit)}`;
    Object.assign(old, data);
    addAudit('UPDATE_CLINIC', `CLINIC:${code}`, diff);
    toast(`Đã cập nhật đối tác ${name}.`);
  } else {
    const nid = Math.max(0, ...STATE.clinics.map(x=>x.id)) + 1;
    STATE.clinics.push({ id:nid, ...data, status:'ACTIVE', deleted:false });
    addAudit('CREATE_CLINIC', `CLINIC:${code}`, `Thêm mới đối tác ${name} (CK ${data.disc}%, HM ${fmtM(data.credit_limit)})`);
    toast(`Đã thêm phòng khám đối tác ${name}.`);
  }
  closeModal(); renderPartnerMgr('clinics');
}

function saveDoctorForm(id) {
  const code = document.getElementById('fDocCode').value.trim(), full_name = document.getElementById('fDocName').value.trim();
  if (!code || !full_name) return toast('Vui lòng nhập Mã và Họ tên bác sĩ.', 'err');

    code, full_name, specialty:document.getElementById('fDocSpec').value.trim(), license:document.getElementById('fDocLic').value.trim(),
    phone:document.getElementById('fDocPhone').value.trim(), clinic_id:Number(document.getElementById('fDocCl').value), disc:Number(document.getElementById('fDocDisc').value)||0
  };
  if (id) {
    const old = STATE.doctors.find(x => x.id === id);
    const diff = `Họ tên: "${old.full_name}" → "${data.full_name}"; CCHN: "${old.license||''}" → "${data.license}"; CK: ${old.disc}% → ${data.disc}%`;
    Object.assign(old, data);
    addAudit('UPDATE_DOCTOR', `DOCTOR:${code}`, diff);
    toast(`Đã cập nhật bác sĩ ${full_name}.`);
  } else {
    const nid = Math.max(0, ...STATE.doctors.map(x=>x.id)) + 1;
    STATE.doctors.push({ id:nid, ...data, status:'ACTIVE', deleted:false });
